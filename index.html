<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Asistan Pro</title>
<meta name="theme-color" content="#130a0c">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg0:#130a0c;--bg1:#1e1114;--bg2:#170d10;--bg3:#0f0709;--bg4:#2c1a1e;
  --line:#4b2d33;--tx:#eadfd8;--tx0:#fff7ee;--tx2:#b9a59f;--tx3:#8c7771;
  --gold:#e8b93a;--blue:#36c2c2;--red:#e30a17;--ok:#3fb950;--bad:#f85149;--warn:#d29922;
  --user:#243b55;--ai:#241518;--star:#f5c542;
  --hl-kw:#ff79c6;--hl-str:#f1fa8c;--hl-cmt:#6272a4;--hl-num:#bd93f9;--hl-fn:#50fa7b;
  --radius:10px;--shadow:0 4px 20px rgba(0,0,0,.35);
}
html.light{
  --bg0:#f7f1e6;--bg1:#fffdf8;--bg2:#fbf6ec;--bg3:#ffffff;--bg4:#efe4d0;
  --line:#dccfb8;--tx:#2b1c1c;--tx0:#1a0e0e;--tx2:#6b5650;--tx3:#85736c;
  --gold:#9a6b00;--blue:#0b7a80;
  --hl-kw:#b3005e;--hl-str:#1c7c1c;--hl-cmt:#7d7d7d;--hl-num:#6f42c1;--hl-fn:#0055aa;
  --user:#dbeafe;--ai:#fdf5e6;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg0);color:var(--tx);overflow:hidden;font-size:15px}

.app{display:grid;grid-template-columns:290px 1fr;height:100dvh;overflow:hidden}

/* ==== SIDEBAR ==== */
.sidebar{background:var(--bg1);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sb-logo{font-family:Georgia,serif;font-weight:bold;font-size:17px;color:var(--gold);flex:1;letter-spacing:.3px}
.sb-new{background:var(--red);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;font-weight:600;transition:filter .15s}
.sb-new:hover{filter:brightness(1.15)}
.sb-search{padding:8px 12px}
.sb-search input{width:100%;padding:8px 10px;background:var(--bg3);color:var(--tx);border:1px solid var(--line);border-radius:6px;font-size:13px}
.sb-search input:focus{outline:none;border-color:var(--gold)}
.sb-list{flex:1;overflow-y:auto;padding:4px 6px}
.conv{padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px;margin:2px 0;display:flex;align-items:center;gap:6px;color:var(--tx2);transition:background .12s}
.conv:hover{background:var(--bg2)}
.conv.active{background:var(--bg4);color:var(--tx0)}
.conv-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-meta{font-size:10px;color:var(--tx3);margin-left:2px}
.conv-del{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:14px;padding:2px 4px;opacity:0;transition:opacity .15s}
.conv:hover .conv-del{opacity:1}
.conv-del:hover{color:var(--bad)}
.sb-empty{padding:20px;text-align:center;color:var(--tx3);font-size:13px}
.sb-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px}
.sb-foot button{flex:1;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12px;cursor:pointer;transition:all .15s}
.sb-foot button:hover{background:var(--bg4);border-color:var(--gold)}

/* ==== MAIN ==== */
.main{display:flex;flex-direction:column;background:var(--bg0);overflow:hidden}
.m-head{background:var(--bg1);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:56px}
.m-title{flex:1;font-size:15px;font-weight:600;color:var(--tx0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-meta{font-size:11px;color:var(--tx3);margin-top:2px;display:flex;align-items:center;gap:6px}
.m-meta .chip{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:10px}
.m-actions{display:flex;gap:4px}
.m-actions button{background:none;border:1px solid var(--line);color:var(--tx2);border-radius:6px;padding:6px 9px;font-size:12px;cursor:pointer;transition:all .15s}
.m-actions button:hover{background:var(--bg2);color:var(--tx0);border-color:var(--gold)}
.hamb{display:none;background:none;border:none;color:var(--tx);font-size:22px;cursor:pointer;padding:4px 8px}

/* ==== MESSAGES ==== */
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:min(860px,92%);padding:11px 14px;border-radius:var(--radius);line-height:1.55;font-size:14px;word-wrap:break-word;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;background:var(--user);color:var(--tx0);border-bottom-right-radius:3px}
.msg.ai{align-self:flex-start;background:var(--bg1);border:1px solid var(--line);border-bottom-left-radius:3px;max-width:min(900px,95%)}
.msg.sys{align-self:center;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--tx2);padding:6px 12px;border-radius:20px;max-width:70%}
.msg.starred{border-color:var(--star);box-shadow:0 0 0 1px var(--star)}
.msg-role{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.msg-role .acts{margin-left:auto;display:flex;gap:2px;opacity:.4;transition:opacity .15s}
.msg:hover .msg-role .acts{opacity:1}
.msg-role .acts button{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:4px;transition:all .1s}
.msg-role .acts button:hover{background:var(--bg3);color:var(--tx0)}
.msg-role .acts button.on{color:var(--star)}
.msg.err{border-color:var(--bad)}
.msg.err .msg-content{color:var(--bad)}
.msg-img{max-width:100%;max-height:280px;border-radius:8px;margin:6px 0;display:block;border:1px solid var(--line)}
.stream-cursor{display:inline-block;width:8px;height:16px;background:var(--gold);margin-left:2px;animation:blink .9s infinite;vertical-align:text-bottom}
@keyframes blink{50%{opacity:0}}

/* markdown inside */
.msg pre{background:var(--bg3);border:1px solid var(--line);border-radius:0 0 6px 6px;padding:10px;overflow-x:auto;font-size:12.5px;margin:0;font-family:'SF Mono',Consolas,monospace;line-height:1.5}
.msg code{background:var(--bg3);padding:1px 5px;border-radius:3px;font-size:12.5px;font-family:'SF Mono',Consolas,monospace;color:var(--gold)}
.msg pre code{background:none;padding:0;color:var(--tx)}
.msg p{margin:0 0 8px}
.msg p:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:6px 0;padding-left:22px}
.msg li{margin:3px 0}
.msg h1,.msg h2,.msg h3,.msg h4{color:var(--gold);margin:12px 0 6px;font-size:1.05em}
.msg h1{font-size:1.3em}.msg h2{font-size:1.15em}
.msg a{color:var(--blue);text-decoration:underline}
.msg strong{color:var(--tx0)}
.msg blockquote{border-left:3px solid var(--gold);padding:4px 10px;margin:8px 0;color:var(--tx2);background:var(--bg2);border-radius:0 4px 4px 0}
.msg hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.msg table{border-collapse:collapse;margin:8px 0;font-size:13px;width:100%}
.msg th,.msg td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.msg th{background:var(--bg3);color:var(--gold);font-weight:600}
.msg input[type=checkbox]{margin-right:6px}

/* code block */
.cb-wrap{margin:10px 0}
.cb-head{display:flex;justify-content:space-between;align-items:center;background:var(--bg4);padding:5px 10px;border-radius:6px 6px 0 0;font-size:11px;color:var(--tx2);border:1px solid var(--line);border-bottom:none}
.cb-head .lang{font-family:monospace;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.cb-head .btn-row{display:flex;gap:4px}
.cb-head button{background:none;border:1px solid var(--line);color:var(--tx2);border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;transition:all .15s}
.cb-head button:hover{color:var(--tx0);border-color:var(--gold);background:var(--bg3)}
/* syntax colors */
.hl-kw{color:var(--hl-kw);font-weight:600}
.hl-str{color:var(--hl-str)}
.hl-cmt{color:var(--hl-cmt);font-style:italic}
.hl-num{color:var(--hl-num)}
.hl-fn{color:var(--hl-fn)}

/* ==== ATTACH BAR ==== */
.attach-bar{background:var(--bg1);border-top:1px solid var(--line);padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px;max-height:120px;overflow-y:auto}
.attach-chip{background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--tx2);max-width:100%}
.attach-chip b{color:var(--tx0);font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:180px;white-space:nowrap}
.attach-chip .del{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:14px;padding:0 2px}
.attach-chip .del:hover{color:var(--bad)}
.attach-chip img{width:28px;height:28px;border-radius:4px;object-fit:cover}

/* ==== COMPOSER ==== */
.composer{background:var(--bg1);border-top:1px solid var(--line);padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px}
.comp-row{display:flex;gap:6px;align-items:flex-end}
.comp-tool-btn{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:0 12px;min-height:44px;cursor:pointer;font-size:16px;transition:all .15s}
.comp-tool-btn:hover{background:var(--bg4);border-color:var(--gold)}
.comp-tool-btn.rec{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.comp-ta{flex:1;resize:none;background:var(--bg3);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;font-family:inherit;min-height:44px;max-height:200px;line-height:1.45;transition:border-color .15s}
.comp-ta:focus{outline:none;border-color:var(--gold)}
.comp-btn{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;min-width:80px;min-height:44px;transition:filter .15s}
.comp-btn:hover:not(:disabled){filter:brightness(1.15)}
.comp-btn:disabled{background:var(--line);color:var(--tx3);cursor:not-allowed}
.comp-btn.stop{background:var(--bad)}
.comp-tools{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--tx3);flex-wrap:wrap}
.comp-tools button{background:none;border:1px solid var(--line);color:var(--tx2);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;transition:all .15s}
.comp-tools button:hover{color:var(--tx0);border-color:var(--gold)}
.comp-tools button.on{background:var(--gold);border-color:var(--gold);color:var(--bg0)}
.comp-tools .info{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ==== MODALS ==== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:60;padding:14px;overflow-y:auto;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal .box{background:var(--bg1);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow);animation:slideIn .2s}
@keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0 0 12px;font-size:16px;color:var(--gold);display:flex;align-items:center;gap:8px}
.modal h2 .close{margin-left:auto;background:none;border:none;color:var(--tx2);cursor:pointer;font-size:20px;padding:0 4px}
.modal label{display:block;margin:10px 0 4px;font-size:12px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.modal input,.modal select,.modal textarea{width:100%;padding:9px 11px;background:var(--bg3);color:var(--tx);border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--gold)}
.modal textarea{min-height:100px;resize:vertical;font-size:13px;font-family:'SF Mono',Consolas,monospace}
.modal .btns{display:flex;gap:6px;margin-top:14px;justify-content:flex-end}
.modal .btns button{padding:9px 16px;border-radius:6px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.modal .btns button:hover{background:var(--bg4)}
.modal .btns .primary{background:var(--red);border-color:var(--red);color:#fff}
.modal .btns .primary:hover{filter:brightness(1.15)}
.modal .hint{font-size:12px;color:var(--tx3);margin:6px 0;line-height:1.5}
.modal .hint a{color:var(--blue)}
.modal .hint code{background:var(--bg3);padding:1px 5px;border-radius:3px;font-size:11px}

.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:4px}
.presets button{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:8px;font-size:12px;cursor:pointer;text-align:left;transition:all .15s}
.presets button:hover{border-color:var(--gold);background:var(--bg4)}
.presets button.on{border-color:var(--gold);background:var(--bg4);color:var(--gold);font-weight:600}

/* command palette */
.cp-modal .box{max-width:520px;padding:0;overflow:hidden}
.cp-input{width:100%;padding:14px 16px;border:none;background:var(--bg3);color:var(--tx);font-size:15px;border-bottom:1px solid var(--line)}
.cp-input:focus{outline:none;border-bottom-color:var(--gold)}
.cp-list{max-height:380px;overflow-y:auto}
.cp-item{padding:10px 16px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:10px;transition:background .1s}
.cp-item:hover,.cp-item.sel{background:var(--bg4)}
.cp-item kbd{margin-left:auto;background:var(--bg2);border:1px solid var(--line);border-radius:3px;padding:1px 5px;font-size:10px;color:var(--tx3);font-family:monospace}
.cp-empty{padding:24px;text-align:center;color:var(--tx3);font-size:13px}

/* prompt library */
.pl-item{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:10px;margin:6px 0;display:flex;align-items:start;gap:10px}
.pl-item .info{flex:1;min-width:0}
.pl-item h4{margin:0 0 4px;font-size:13px;color:var(--gold)}
.pl-item p{margin:0;font-size:11px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pl-item button{background:none;border:1px solid var(--line);color:var(--tx2);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;align-self:center}
.pl-item button:hover{color:var(--bad);border-color:var(--bad)}

/* ==== TOASTS ==== */
#toasts{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:70;max-width:calc(100vw - 24px)}
.toast{background:var(--bg1);border:1px solid var(--line);border-left:3px solid var(--blue);padding:10px 14px;border-radius:6px;font-size:13px;box-shadow:var(--shadow);animation:slideInR .2s;color:var(--tx)}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
@keyframes slideInR{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

/* ==== DROP ==== */
.drop-overlay{position:fixed;inset:0;background:rgba(227,10,23,.15);border:3px dashed var(--gold);z-index:80;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--gold);font-weight:600;text-align:center;padding:20px}
.drop-overlay small{display:block;font-size:13px;color:var(--tx0);margin-top:8px;font-weight:400}

/* ==== EMPTY ==== */
.empty-state{text-align:center;padding:60px 20px;color:var(--tx3);max-width:520px;margin:0 auto}
.empty-state h2{color:var(--gold);font-size:24px;margin:0 0 8px;font-family:Georgia,serif}
.empty-state .ex{background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:13px;text-align:left;cursor:pointer;transition:border-color .15s}
.empty-state .ex:hover{border-color:var(--gold)}
.empty-state .ex b{color:var(--blue);display:block;margin-bottom:2px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}

/* ==== SCROLL ==== */
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
*::-webkit-scrollbar-thumb:hover{background:var(--tx3)}

/* ==== OVERLAY ==== */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39}

/* search highlight */
mark{background:var(--gold);color:var(--bg0);padding:0 2px;border-radius:2px}

/* mobile */
@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(85vw,320px);z-index:40;transform:translateX(-100%);transition:transform .25s ease}
  .sidebar.open{transform:none}
  .overlay.show{display:block}
  .hamb{display:block}
  .msg{max-width:95%}
  .messages{padding:10px}
  .composer{padding:8px 10px 12px}
  .comp-btn{min-width:60px;padding:10px}
  .comp-tool-btn{padding:0 8px;min-height:44px;font-size:15px}
  .modal{padding:0}
  .modal .box{max-width:100%;max-height:100dvh;border-radius:0;padding:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">🤖 AI Asistan <span style="font-size:10px;color:var(--tx3);font-family:sans-serif">PRO</span></div>
    </div>
    <div class="sb-search"><input id="convSearch" placeholder="🔍 Sohbetlerde ara… (Ctrl+K)"></div>
    <div class="sb-list" id="convList"></div>
    <div class="sb-foot">
      <button data-act="newChat">➕ Yeni</button>
      <button data-act="openSettings">⚙️</button>
      <button data-act="openPrompts">📚</button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main class="main">
    <header class="m-head">
      <button class="hamb" id="hamb">☰</button>
      <div style="flex:1;min-width:0">
        <div class="m-title" id="mTitle">Yeni Sohbet</div>
        <div class="m-meta" id="mMeta"></div>
      </div>
      <div class="m-actions">
        <button data-act="openConvSettings" title="Sohbet ayarları (model, prompt)">⚙️</button>
        <button data-act="exportChat" title="Markdown indir">📤</button>
        <button data-act="copyAll" title="Tümünü kopyala">📋</button>
        <button data-act="clearChat" title="Sohbeti temizle">🧹</button>
      </div>
    </header>
    <div class="messages" id="messages"></div>
    <div class="attach-bar" id="attachBar" style="display:none"></div>
    <div class="composer">
      <div class="comp-row">
        <button class="comp-tool-btn" id="attachBtn" title="Dosya ekle">📎</button>
        <button class="comp-tool-btn" id="micBtn" title="Sesli giriş">🎙️</button>
        <textarea class="comp-ta" id="ta" placeholder="Mesaj yaz… (Enter = gönder, Shift+Enter = yeni satır, Ctrl+K = komut)" rows="1"></textarea>
        <button class="comp-btn" id="sendBtn">Gönder</button>
      </div>
      <div class="comp-tools">
        <button data-act="regen" id="regenBtn" style="display:none">🔄 Yeniden</button>
        <button data-act="ttsOn" id="ttsBtn" title="Sesli oku">🔊 Oku</button>
        <button data-act="searchIn" id="searchBtn" title="Sohbette ara">🔍</button>
        <span class="info" id="tokenInfo"></span>
      </div>
    </div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toasts"></div>
<input type="file" id="fileInput" multiple accept=".txt,.md,.js,.ts,.jsx,.tsx,.html,.css,.json,.yml,.yaml,.py,.sql,.xml,.csv,.jpg,.jpeg,.png,.gif,.webp" style="display:none">

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════════════
   1. SABİTLER VE DURUM
   ═══════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);

/* GÖMÜLÜ API ANAHTARI */
const EMBEDDED_KEY = 'AQ.Ab8RN6KTOG0Zoo--lzgyBhiXPP7zq4NVb8m8Mg3J8hE-lmMlxw';

const K = {
  convs:'aip_convs', settings:'aip_settings', active:'aip_active',
  theme:'aip_theme', prompts:'aip_prompts'
};

const esc = s => String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtBytes = n => n<1024?n+' B':n<1024*1024?(n/1024).toFixed(1)+' KB':(n/1024/1024).toFixed(2)+' MB';
const estTokens = t => Math.ceil((t||'').length/4);
const fmtNum = n => n.toLocaleString('tr-TR');
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function activeConv(){ return State.convs.find(c=>c.id===State.activeId); }
function convSettings(c){ return Object.assign({}, State.settings, c?.settings || {}); }
function newConv(){
  const c = {
    id:uid(), title:'Yeni Sohbet', msgs:[],
    created:Date.now(), updated:Date.now(),
    settings:{}
  };
  State.convs.unshift(c);
  State.activeId = c.id;
  saveConvs(); saveActive();
  return c;
}
function setTitleFromFirst(c, text){
  if(c.msgs.filter(m=>m.role==='user').length>1) return;
  let t = (text||'').replace(/\s+/g,' ').trim().slice(0,50);
  c.title = t || 'Yeni Sohbet';
}
function activeMsgCount(c){ return c?.msgs.filter(m=>m.role==='user').length || 0; }

/* ═══════════════════════════════════════════════════════════════════════════
   4. SYNTAX HIGHLIGHT + MARKDOWN
   ═══════════════════════════════════════════════════════════════════════════ */
function highlight(code, lang){
  code = esc(code);
  lang = (lang||'').toLowerCase();
  const re = lang==='html'||lang==='xml'
    ? /(&lt;\/?)([a-z][\w-]*)|("[^"]*"|'[^']*')|(&gt;)/gi
    : /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|(\b(?:function|const|let|var|if|else|for|while|return|class|new|this|true|false|null|undefined|async|await|try|catch|throw|import|export|from|of|in|def|elif|print|lambda|yield|None|True|False|and|or|not|is|with|as)\b)|(\b\d+(?:\.\d+)?\b)/g;
  return code.replace(re, (m, cmt, str, kw, num)=>{
    if(cmt) return `<span class="hl-cmt">${cmt}</span>`;
    if(str) return `<span class="hl-str">${str}</span>`;
    if(kw) return `<span class="hl-kw">${kw}</span>`;
    if(num) return `<span class="hl-num">${num}</span>`;
    return m;
  });
}
function md(src){
  if(!src) return '';
  let h = String(src);
  /* code blocks first */
  const cb = [];
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_,lang,code)=>{
    const i = cb.length;
    cb.push({lang, code});
    return '\u0000CB'+i+'\u0000';
  });
  /* escape */
  h = h.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  /* inline code */
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  /* headers */
  h = h.replace(/^###### (.*)$/gm,'<h6>$1</h6>');
  h = h.replace(/^##### (.*)$/gm,'<h5>$1</h5>');
  h = h.replace(/^#### (.*)$/gm,'<h4>$1</h4>');
  h = h.replace(/^### (.*)$/gm,'<h3>$1</h3>');
  h = h.replace(/^## (.*)$/gm,'<h2>$1</h2>');
  h = h.replace(/^# (.*)$/gm,'<h1>$1</h1>');
  /* horizontal rule */
  h = h.replace(/^---+$/gm,'<hr>');
  /* blockquote */
  h = h.replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>');
  /* bold/italic */
  h = h.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');
  h = h.replace(/~~([^~\n]+)~~/g,'<del>$1</del>');
  /* links */
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  /* task list */
  h = h.replace(/^[-*] \[ \] (.*)$/gm,'<div><input type="checkbox" disabled> $1</div>');
  h = h.replace(/^[-*] \[x\] (.*)$/gm,'<div><input type="checkbox" checked disabled> $1</div>');
  /* tables */
  const lines = h.split('\n');
  const out = [];
  let inTable = false, header = null;
  for(let i=0;i<lines.length;i++){
    const ln = lines[i];
    if(/^\|.*\|$/.test(ln) && i+1<lines.length && /^\|[\s:|-]+\|$/.test(lines[i+1])){
      header = ln.split('|').slice(1,-1).map(x=>x.trim());
      inTable = true;
      out.push('<table><thead><tr>'+header.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>');
      i++; continue;
    }
    if(inTable && /^\|.*\|$/.test(ln)){
      const cells = ln.split('|').slice(1,-1).map(x=>x.trim());
      out.push('<tr>'+cells.map(x=>'<td>'+x+'</td>').join('')+'</tr>');
      continue;
    }
    if(inTable){ out.push('</tbody></table>'); inTable = false; }
    out.push(ln);
  }
  if(inTable) out.push('</tbody></table>');
  h = out.join('\n');
  /* lists */
  h = h.replace(/^[-*] (.*)$/gm,'<li>$1</li>');
  h = h.replace(/(?:^|\n)((?:<li>.*<\/li>\n?)+)/g, (m,lis)=>'\n<ul>'+lis+'</ul>\n');
  h = h.replace(/^\d+\. (.*)$/gm,'<oli>$1</oli>');
  h = h.replace(/(?:^|\n)((?:<oli>.*<\/oli>\n?)+)/g,(m,lis)=>'\n<ol>'+lis.replace(/<\/?oli>/g,x=>x.replace('oli','li'))+'</ol>\n');
  /* paragraphs */
  h = h.split(/\n\n+/).map(p=>{
    if(/^\s*<(ul|ol|h\d|pre|div|table|blockquote|hr)/.test(p) || /^\u0000CB/.test(p)) return p;
    return '<p>'+p.replace(/\n/g,'<br>')+'</p>';
  }).join('\n');
  /* restore code */
  cb.forEach((b,i)=>{
    const hid = 'cb_'+Math.random().toString(36).slice(2,9);
    const canRun = /html|js|javascript/.test(b.lang||'');
    const btns = `<div class="btn-row">
      <button class="cb-copy" data-cbid="${hid}">📋 Kopyala</button>
      <button class="cb-dl" data-cbid="${hid}" data-lang="${esc(b.lang||'txt')}">⬇️</button>
      ${canRun?`<button class="cb-run" data-code="${encodeURIComponent(b.code)}" data-lang="${esc(b.lang)}">▶️ Çalıştır</button>`:''}
    </div>`;
    h = h.replace('\u0000CB'+i+'\u0000',
      `<div class="cb-wrap"><div class="cb-head"><span class="lang">${esc(b.lang||'kod')}</span>${btns}</div><pre id="${hid}"><code>${highlight(b.code,b.lang)}</code></pre></div>`);
  });
  return h;
}

/* code block events */
document.addEventListener('click', e=>{
  const copy = e.target.closest('.cb-copy');
  if(copy){
    const pre = document.getElementById(copy.dataset.cbid);
    if(pre) navigator.clipboard.writeText(pre.textContent).then(()=>toast('Kod kopyalandı','ok'));
    return;
  }
  const dl = e.target.closest('.cb-dl');
  if(dl){
    const pre = document.getElementById(dl.dataset.cbid);
    if(pre) downloadFile('code.'+(dl.dataset.lang||'txt'), pre.textContent);
    return;
  }
  const run = e.target.closest('.cb-run');
  if(run){
    const code = decodeURIComponent(run.dataset.code);
    const lang = run.dataset.lang;
    const win = window.open('', '_blank');
    win.document.write(lang==='html' ? code : `<html><head><title>JS</title></head><body><pre id="out"></pre><script>try{const r=eval(${JSON.stringify(code)});document.getElementById('out').textContent=String(r);}catch(e){document.getElementById('out').textContent='Hata: '+e.message;}<\/script></body></html>`);
    win.document.close();
  }
});

/* ═══════════════════════════════════════════════════════════════════════════
   5. AI ÇAĞRISI (STREAMING)
   ═══════════════════════════════════════════════════════════════════════════ */
async function* streamAI(messages, signal){
  const s = convSettings(activeConv());
  const sys = s.systemPrompt || '';
  if(s.provider==='gemini'){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${s.model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(s.key)}`;
    const res = await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      signal,
      body: JSON.stringify({
        systemInstruction:{parts:[{text:sys}]},
        contents: messages.map(m=>{
          const parts = [];
          if(m.content) parts.push({text: m.content});
          if(m.img){
            const mime = (m.img.match(/data:([^;]+);/)||[])[1]||'image/jpeg';
            const data = m.img.split(',')[1];
            if(data) parts.push({inlineData:{mimeType:mime, data}});
          }
          return {role: m.role==='assistant'?'model':'user', parts};
        }),
        generationConfig:{temperature:+s.temp, maxOutputTokens:+s.maxTokens}
      })
    });
    if(!res.ok){
      const errBody = await res.text().catch(()=>'');
      let msg = 'HTTP '+res.status;
      try{ const j=JSON.parse(errBody); msg = j.error?.message || msg; }catch(e){}
      throw new Error(msg);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        if(!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if(!data) continue;
        try{
          const j = JSON.parse(data);
          const txt = ((j.candidates?.[0]?.content?.parts)||[]).map(p=>p.text||'').join('');
          if(txt) yield txt;
        }catch(e){}
      }
    }
  } else if(s.provider==='openai'){
    const msgs = [{role:'system',content:sys}, ...messages.map(m=>{
      if(m.img) return {role:m.role, content:[{type:'text',text:m.content||''},{type:'image_url',image_url:{url:m.img}}]};
      return {role:m.role, content:m.content};
    })];
    const res = await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.key},
      signal,
      body: JSON.stringify({model:s.model, messages:msgs, temperature:+s.temp, max_tokens:+s.maxTokens, stream:true})
    });
    if(!res.ok){
      const errBody = await res.text().catch(()=>'');
      let msg = 'HTTP '+res.status;
      try{ const j=JSON.parse(errBody); msg = j.error?.message || msg; }catch(e){}
      throw new Error(msg);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        if(!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if(data==='[DONE]') return;
        try{
          const j = JSON.parse(data);
          const txt = j.choices?.[0]?.delta?.content || '';
          if(txt) yield txt;
        }catch(e){}
      }
    }
  } else if(s.provider==='ollama'){
    const res = await fetch('http://localhost:11434/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      signal,
      body: JSON.stringify({
        model:s.model,
        messages:[{role:'system',content:sys}, ...messages.map(m=>({role:m.role,content:m.content||''}))],
        stream:true,
        options:{temperature:+s.temp, num_predict:+s.maxTokens}
      })
    });
    if(!res.ok) throw new Error('Ollama bağlantısı: HTTP '+res.status+' (ollama serve çalışıyor mu?)');
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        if(!line.trim()) continue;
        try{
          const j = JSON.parse(line);
          if(j.message?.content) yield j.message.content;
          if(j.done) return;
        }catch(e){}
      }
    }
  } else {
    throw new Error('Sağlayıcı seçilmedi');
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   6. GÖNDER / STREAM / REGEN / EDIT
   ═══════════════════════════════════════════════════════════════════════════ */
async function send(retryOf){
  if(State.busy) return;
  const ta = $('ta');
  let text = (ta.value||'').trim();
  if(!retryOf && !text && !State.attachments.length) return;

  const s = convSettings(activeConv());
  if(!s.key && s.provider!=='ollama') return openSettings();

  let full = text;
  let img = null;
  if(!retryOf && State.attachments.length){
    const textFiles = State.attachments.filter(a=>!a.isImg);
    const imgFiles = State.attachments.filter(a=>a.isImg);
    if(textFiles.length){
      const parts = textFiles.map(a=>`--- DOSYA: ${a.name} (${fmtBytes(a.size)}) ---\n\`\`\`\n${a.content}\n\`\`\``);
      full = parts.join('\n\n') + '\n\n' + (text || 'Yukarıdaki dosya(lar)ı analiz et.');
    }
    if(imgFiles.length) img = imgFiles[0].content;
  }

  const c = activeConv() || newConv();

  if(!retryOf){
    const userMsg = {id:uid(), role:'user', content:full, img, t:Date.now()};
    c.msgs.push(userMsg);
    c.updated = Date.now();
    setTitleFromFirst(c, text || (State.attachments[0]?.name||''));
    State.lastUserMsg = full;
    State.attachments = [];
    renderAttachments();
    ta.value = '';
    autoResize();
    updateSendBtn();
    saveConvs();
  }

  renderMessages();
  State.busy = true;
  State.error = '';
  State.streaming = true;
  State.abortCtrl = new AbortController();
  renderHeader();
  updateSendBtn();

  /* placeholder assistant msg */
  const asstMsg = {id:uid(), role:'assistant', content:'', t:Date.now(), model:s.model};
  c.msgs.push(asstMsg);
  renderMessages();

  let tokens = {in:0, out:0};
  try{
    const history = c.msgs.filter(m=>m!==asstMsg && (m.role==='user'||m.role==='assistant')).map(m=>({role:m.role, content:m.content, img:m.img}));
    tokens.in = estTokens(history.map(m=>m.content).join(' '));

    let acc = '';
    let lastRender = 0;
    const stream = streamAI(history, State.abortCtrl.signal);
    for await(const chunk of stream){
      acc += chunk;
      asstMsg.content = acc;
      const now = Date.now();
      if(now - lastRender > 60){
        lastRender = now;
        updateStreamingMsg(asstMsg.id, acc);
      }
    }
    asstMsg.content = acc;
    tokens.out = estTokens(acc);
    asstMsg.tokens = tokens;
    c.updated = Date.now();
    saveConvs();
    if(State.ttsEnabled && acc) speak(acc);
  }catch(e){
    if(e.name === 'AbortError'){
      asstMsg.content = asstMsg.content || '[Durduruldu]';
    } else {
      State.error = String(e.message||e);
      asstMsg.content = asstMsg.content || ('⚠️ '+State.error);
      asstMsg.err = true;
    }
    saveConvs();
  }

  State.busy = false;
  State.streaming = false;
  State.abortCtrl = null;
  renderMessages();
  renderHeader();
  updateSendBtn();
  if(!State.error) toast('Yanıt tamam', 'ok');
  else toast('Hata: '+State.error, 'bad');
}
function updateStreamingMsg(msgId, content){
  const box = $('messages');
  const els = box.querySelectorAll('.msg.ai');
  if(!els.length) return renderMessages();
  const el = els[els.length-1];
  const c = el.querySelector('.msg-content');
  if(c) c.innerHTML = md(content) + '<span class="stream-cursor"></span>';
  box.scrollTop = box.scrollHeight;
}

async function regenerateFrom(idx){
  const c = activeConv(); if(!c) return;
  /* drop messages after idx (exclusive of assistant we want to redo) */
  while(c.msgs.length-1 > idx) c.msgs.pop();
  saveConvs();
  renderMessages();
  /* rebuild history minus last assistant */
  if(c.msgs.length && c.msgs[c.msgs.length-1].role==='assistant') c.msgs.pop();
  saveConvs();
  renderMessages();
  /* push empty assistant by reusing send without user msg */
  State.busy = false;
  const ta = $('ta'); const saved = ta.value; ta.value = ''; 
  await send(true);
  ta.value = saved;
}

function editMsg(msgId){
  const c = activeConv(); if(!c) return;
  const msg = c.msgs.find(m=>m.id===msgId);
  if(!msg || msg.role!=='user') return;
  const ta = $('ta');
  ta.value = msg.content;
  ta.focus();
  autoResize();
  updateSendBtn();
  /* remove from that point */
  const idx = c.msgs.indexOf(msg);
  while(c.msgs.length>idx) c.msgs.pop();
  saveConvs();
  renderMessages();
}

async function branchFrom(msgId){
  const c = activeConv(); if(!c) return;
  const idx = c.msgs.findIndex(m=>m.id===msgId);
  if(idx<0) return;
  const newC = {
    id:uid(),
    title: c.title + ' (dal)',
    msgs: JSON.parse(JSON.stringify(c.msgs.slice(0, idx+1))),
    created:Date.now(), updated:Date.now(),
    settings: Object.assign({}, c.settings),
    forkedFrom:{convId:c.id, msgId:msgId}
  };
  newC.msgs.forEach(m=>m.id = m.id || uid());
  State.convs.unshift(newC);
  State.activeId = newC.id;
  saveConvs(); saveActive();
  renderSidebar(); renderMessages(); renderHeader();
  toast('🌿 Konuşma dallandırıldı','ok');
}

function starMsg(msgId){
  const c = activeConv(); if(!c) return;
  const m = c.msgs.find(x=>x.id===msgId);
  if(!m) return;
  m.starred = !m.starred;
  saveConvs();
  renderMessages();
  renderHeader();
}

function renderSidebar(){
  const q = ($('convSearch').value||'').toLowerCase();
  const list = State.convs.filter(c=>{
    if(!q) return true;
    if(c.title.toLowerCase().includes(q)) return true;
    return c.msgs.some(m=>String(m.content||'').toLowerCase().includes(q));
  });
  const box = $('convList');
  if(!list.length){
    box.innerHTML = '<div class="sb-empty">'+(q?'Sonuç yok':'Henüz sohbet yok')+'</div>';
    return;
  }
  box.innerHTML = list.map(c=>{
    const n = c.msgs.filter(m=>m.role==='user').length;
    return `<div class="conv ${c.id===State.activeId?'active':''}" data-cid="${c.id}">
      <span class="conv-title">${esc(c.title)}</span>
      <span class="conv-meta">${n>0?n+'💬':''}</span>
      <button class="conv-del" data-del="${c.id}" title="Sil">✕</button>
    </div>`;
  }).join('');
}

function renderHeader(){
  const c = activeConv();
  const s = convSettings(c);
  $('mTitle').textContent = c?c.title:'Yeni Sohbet';
  const model = s.model;
  const prov = PROVIDERS[s.provider]?.n || s.provider;
  const tokSum = (c?.msgs||[]).reduce((a,m)=>a+(m.tokens?.out||0),0);
  const cost = (c?.msgs||[]).reduce((a,m)=>{
    const p = COSTS[m.model] || COSTS[s.model] || {in:0,out:0};
    const t = m.tokens || {in:0,out:0};
    return a + (t.in/1e6*p.in) + (t.out/1e6*p.out);
  },0);
  $('mMeta').innerHTML = `<span class="chip">${esc(prov)}</span> <span class="chip">${esc(model)}</span>${tokSum>0?`<span class="chip">${fmtNum(tokSum)} çıkış tok</span>`:''}${cost>0?`<span class="chip">~$${cost.toFixed(4)}</span>`:''}`;
  $('regenBtn').style.display = c && c.msgs.some(m=>m.role==='assistant') ? '' : 'none';
  $('ttsBtn').classList.toggle('on', State.ttsEnabled);
  const total = estTokens((c?.msgs||[]).map(m=>m.content||'').join('\n')) + State.attachments.reduce((a,b)=>a+estTokens(b.content),0);
  const el = $('tokenInfo');
  if(total>0){ el.textContent = `≈ ${fmtNum(total)} token`; el.className = 'info'+(total>100000?' bad':''); }
  else el.textContent = '';
}

function renderMessages(){
  const c = activeConv();
  const box = $('messages');
  if(!c || !c.msgs.length){ box.innerHTML = emptyState(); return; }
  box.innerHTML = c.msgs.map((m,i)=>{
    if(m.role==='user') return renderUserMsg(m,i);
    if(m.role==='assistant') return renderAiMsg(m,i);

   9. SES (STT + TTS)
   ═══════════════════════════════════════════════════════════════════════════ */
let recognition = null;
let listening = false;
function setupRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.lang = 'tr-TR';
  r.continuous = false;
  r.interimResults = true;
  r.onresult = e=>{
    let transcript = '';
    for(let i=e.resultIndex;i<e.results.length;i++) transcript += e.results[i][0].transcript;
    const ta = $('ta');
    ta.value = transcript;
    autoResize();
    updateSendBtn();
  };
  r.onend = ()=>{ listening=false; $('micBtn').classList.remove('rec'); };
  r.onerror = e=>{ listening=false; $('micBtn').classList.remove('rec'); toast('Ses hatası: '+e.error,'bad'); };
  return r;
}
function toggleMic(){
  if(!recognition) recognition = setupRecognition();
  if(!recognition) return toast('Tarayıcı sesli girişi desteklemiyor (Chrome/Edge öner)','bad');
  if(listening){ recognition.stop(); listening=false; $('micBtn').classList.remove('rec'); }
  else { try{ recognition.start(); listening=true; $('micBtn').classList.add('rec'); }catch(e){ toast('Mikrofon başlatılamadı','bad'); } }
}
function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.slice(0, 4000));
    u.lang = 'tr-TR';
    u.rate = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════════════════════
   10. DOSYA YÜKLEME
   ═══════════════════════════════════════════════════════════════════════════ */
async function addFiles(files){
  for(const f of Array.from(files)){
    const isImg = f.type.startsWith('image/');
    const limit = isImg ? MAX_IMG_BYTES : MAX_FILE_BYTES;
    if(f.size > limit){ toast(`"${f.name}" çok büyük (max ${fmtBytes(limit)})`,'bad'); continue; }
    const total = State.attachments.reduce((a,b)=>a+b.size,0) + f.size;
    if(total > MAX_TOTAL_BYTES){ toast('Toplam boyut sınırı aşıldı','bad'); break; }
    try{
      if(isImg){
        const dataUrl = await new Promise((res,rej)=>{
          const r = new FileReader();
          r.onload = ()=>res(r.result);
          r.onerror = rej;
          r.readAsDataURL(f);
        });
        State.attachments.push({name:f.name, content:dataUrl, size:f.size, isImg:true});
      } else {
        const text = await f.text();
        State.attachments.push({name:f.name, content:text, size:f.size, isImg:false});
      }
    }catch(e){ toast('"'+f.name+'" okunamadı','bad'); }
  }
  renderAttachments(); updateSendBtn(); renderHeader();
  toast(`${files.length} dosya eklendi`,'ok');
}

/* ═══════════════════════════════════════════════════════════════════════════
   11. YARDIMCI EYLEMLER
   ═══════════════════════════════════════════════════════════════════════════ */
function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast '+(kind||'');
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(()=>t.remove(), 3800);
}
function downloadFile(name, content, mime='text/plain'){
  const blob = new Blob([content], {type:mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function downloadBackup(){
  const data = {
    version:1, exportedAt:Date.now(),
    convs: State.convs,
    settings: State.settings,
    prompts: State.prompts,
    activeId: State.activeId
  };
  downloadFile('ai-asistan-backup-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(data,null,2), 'application/json');
  toast('💾 Yedek indirildi','ok');
}
function importBackup(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async e=>{
    const f = e.target.files?.[0]; if(!f) return;
    try{
      const text = await f.text();
      const data = JSON.parse(text);
      if(!data.convs) throw new Error('Geçersiz yedek');
      if(!confirm('Mevcut sohbet+ayarlar bu yedekle DEĞİŞTİRİLECEK. Emin misin?')) return;
      State.convs = data.convs;
      if(data.settings) State.settings = data.settings;
      if(data.prompts) State.prompts = data.prompts;
      State.activeId = data.activeId || (State.convs[0]?.id || null);
      saveConvs(); saveSettings(); savePrompts(); saveActive();
      renderSidebar(); renderMessages(); renderHeader();
      toast('✅ Yedek yüklendi','ok');
    }catch(e){ toast('Geçersiz dosya: '+e.message,'bad'); }
  };
  inp.click();
}
function toggleTheme(){
  const cur = localStorage.getItem(K.theme)||'dark';
  const next = cur==='light'?'dark':'light';
  localStorage.setItem(K.theme, next);
  applyTheme();
  toast(next==='light'?'☀️ Açık tema':'🌙 Koyu tema','ok');
}
function applyTheme(){
  const t = localStorage.getItem(K.theme) || 'dark';
  document.documentElement.classList.toggle('light', t==='light');
  const tc = document.querySelector('meta[name=theme-color]');
  if(tc) tc.setAttribute('content', t==='light'?'#f7f1e6':'#130a0c');
}

/* ═══════════════════════════════════════════════════════════════════════════
   12. EYLEMLER (ACT)
   ═══════════════════════════════════════════════════════════════════════════ */
const ACT = {
  newChat(){ newConv(); renderSidebar(); renderMessages(); renderHeader(); $('sidebar').classList.remove('open'); $('overlay').classList.remove('show'); $('ta').focus(); },
  openSettings(){ openSettings(); },
  openPrompts(){ openPrompts(); },
  openConvSettings(){ openConvSettings(); },
  exportChat(){
    const c = activeConv();
    if(!c||!c.msgs.length) return toast('Sohbet boş','warn');
    const mdContent = `# ${c.title}\n\n_${new Date(c.created).toLocaleString('tr-TR')}_\n\n` +
      c.msgs.map(m=>{
        const role = m.role==='user'?'👤 **Sen**':m.role==='assistant'?'🤖 **Asistan**':'';
        return `## ${role}\n\n${m.content}\n`;
      }).join('\n---\n\n');
    downloadFile(c.title.replace(/[^\w\-]+/g,'_')+'.md', mdContent, 'text/markdown');
    toast('📤 İndirildi','ok');
  },
  copyAll(){
    const c = activeConv();
    if(!c||!c.msgs.length) return toast('Sohbet boş','warn');
    const text = c.msgs.map(m=>{
      const role = m.role==='user'?'👤 Sen':m.role==='assistant'?'🤖 Asistan':'';
      return `=== ${role} ===\n${m.content}`;
    }).join('\n\n');
    navigator.clipboard.writeText(text).then(()=>toast('📋 Kopyalandı','ok'));
  },
  clearChat(){
    const c = activeConv();
    if(c && confirm('Bu sohbetin mesajları silinsin mi?')){
      c.msgs = []; saveConvs(); renderMessages(); renderHeader();
    }
  },
  regen(){ if(!State.busy && State.lastUserMsg){ const c=activeConv(); if(c) regenerateFrom(c.msgs.length-1); } },
  regenFrom(d){
    const c = activeConv(); if(!c) return;
    const idx = c.msgs.findIndex(m=>m.id===d.mid);
    if(idx<0) return;
    if(c.msgs[idx].role==='assistant') regenerateFrom(idx-1);
  },
  starMsg(d){
    starMsg(d.mid);
  },
  editMsg(d){ editMsg(d.mid); },
  branchMsg(d){ branchFrom(d.mid); },
  copyMsg(d){
    const c = activeConv(); const m = c?.msgs.find(x=>x.id===d.mid);
    if(m) navigator.clipboard.writeText(m.content).then(()=>toast('Kopyalandı','ok'));
  },
  delMsg(d){
    const c = activeConv(); if(!c) return;
    const idx = c.msgs.findIndex(m=>m.id===d.mid);
    if(idx<0) return;
    c.msgs.splice(idx,1); saveConvs(); renderMessages(); renderHeader();
  },
  speakMsg(d){
    const c = activeConv(); const m = c?.msgs.find(x=>x.id===d.mid);
    if(m) speak(m.content);
  },
  ttsOn(){
    State.ttsEnabled = !State.ttsEnabled;
    $('ttsBtn').classList.toggle('on', State.ttsEnabled);
    toast(State.ttsEnabled?'🔊 Otomatik okuma AÇIK':'🔇 Otomatik okuma kapalı','ok');
  },
  searchIn(){
    const q = prompt('Sohbette ara:');
    if(!q) return;
    State.searchQuery = q;
    const box = $('messages');
    const html = box.innerHTML;
    if(!html.includes('data-orig')) box.dataset.orig = html;
    // basit highlight: yeniden render et ve vurgula
    const c = activeConv();
    if(!c) return;
    renderMessages();
    const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
    const hits = [];
    let n;
    while(n = walker.nextNode()){
      if(n.nodeValue.toLowerCase().includes(q.toLowerCase())) hits.push(n);
    }
    hits.forEach(node=>{
      const parts = node.nodeValue.split(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'));
      const span = document.createElement('span');
      parts.forEach((p,i)=>{ span.appendChild(i%2===1?Object.assign(document.createElement('mark'),{textContent:p}):document.createTextNode(p)); });
      node.parentNode.replaceChild(span, node);
    });
    if(!hits.length) toast('Bulunamadı','warn');
    else toast(`${hits.length} sonuç bulundu`,'ok');
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   13. EVENT HANDLERS
   ═══════════════════════════════════════════════════════════════════════════ */
$('hamb').addEventListener('click', ()=>{ $('sidebar').classList.add('open'); $('overlay').classList.add('show'); });
$('overlay').addEventListener('click', ()=>{ $('sidebar').classList.remove('open'); $('overlay').classList.remove('show'); });
$('convSearch').addEventListener('input', renderSidebar);

$('convList').addEventListener('click', e=>{
  const del = e.target.closest('[data-del]');
  if(del){
    e.stopPropagation();
    if(confirm('Bu sohbet silinsin mi?')){
      State.convs = State.convs.filter(x=>x.id!==del.dataset.del);
      if(State.activeId===del.dataset.del) State.activeId = State.convs[0]?.id||null;
      saveConvs(); saveActive(); renderSidebar(); renderMessages(); renderHeader();
    }
    return;
  }
  const conv = e.target.closest('[data-cid]');
  if(conv){
    State.activeId = conv.dataset.cid;
    saveActive(); renderSidebar(); renderMessages(); renderHeader();
    $('sidebar').classList.remove('open'); $('overlay').classList.remove('show');
  }
});

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act;
  if(ACT[act]){ ACT[act](b.dataset); }
});

$('messages').addEventListener('click', e=>{
  const ex = e.target.closest('[data-ex]');
  if(ex){ $('ta').value = ex.dataset.ex; autoResize(); updateSendBtn(); $('ta').focus(); }
});

$('attachBtn').addEventListener('click', ()=> $('fileInput').click());
$('fileInput').addEventListener('change', e=>{ addFiles(e.target.files); e.target.value=''; });
$('micBtn').addEventListener('click', toggleMic);
$('attachBar').addEventListener('click', e=>{
  const d = e.target.closest('[data-attach-del]');
  if(d){ State.attachments.splice(+d.dataset.attachDel,1); renderAttachments(); updateSendBtn(); renderHeader(); }
});

$('ta').addEventListener('input', ()=>{ autoResize(); updateSendBtn(); });
$('ta').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey && !e.isComposing){
    if(window.matchMedia('(max-width:768px)').matches && !e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    if(!$('sendBtn').disabled) doSend();
  }
});

function doSend(){
  if(State.streaming && State.abortCtrl){ State.abortCtrl.abort(); return; }
  send();
}
$('sendBtn').addEventListener('click', doSend);

$('modalRoot').addEventListener('click', e=>{ if(e.target.closest('[data-close]')) closeModal(); });

/* keyboard shortcuts */
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key==='k'){ e.preventDefault(); openCommandPalette(); }
  else if((e.ctrlKey||e.metaKey) && e.key==='t'){ e.preventDefault(); toggleTheme(); }
  else if(e.key==='Escape'){ closeModal(); }
});

/* drag drop */
let dragDepth = 0;
document.addEventListener('dragenter', e=>{
  if(!e.dataTransfer?.types?.includes('Files')) return;
  dragDepth++;
  if(dragDepth===1){
    const ov = document.createElement('div');
    ov.className = 'drop-overlay'; ov.id = 'dropOv';
    ov.innerHTML = '📁 Dosya veya görsel bırak<small>Metin, kod, resim — hepsi analiz edilir</small>';
    document.body.appendChild(ov);
  }
});
document.addEventListener('dragleave', ()=>{ dragDepth = Math.max(0, dragDepth-1); if(!dragDepth) document.getElementById('dropOv')?.remove(); });
document.addEventListener('dragover', e=>{ e.preventDefault(); });
document.addEventListener('drop', e=>{
  e.preventDefault(); dragDepth = 0;
  document.getElementById('dropOv')?.remove();
  if(e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
});

/* ═══════════════════════════════════════════════════════════════════════════
   14. INIT
   ═══════════════════════════════════════════════════════════════════════════ */
loadAll();
applyTheme();
if(!State.convs.length) newConv();
renderSidebar();
renderMessages();
renderHeader();
renderAttachments();
updateSendBtn();
$('ta').focus();
window.addEventListener('beforeunload', ()=>{ saveConvs(); saveSettings(); savePrompts(); });

console.log('%c🤖 AI Asistan Pro hazır', 'color:#e8b93a;font-size:16px;font-weight:bold');
console.log('Model:', State.settings.model);
console.log('Anahtar:', State.settings.key.slice(0,10)+'...');
console.log('Kısayollar: Ctrl+K (palet), Ctrl+T (tema), Ctrl+Enter (mobil gönder)');
