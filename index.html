<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Asistan v3.1</title>
<meta name="theme-color" content="#130a0c">
<style>
:root{
  --bg:#0d1117;--bg1:#161b22;--bg2:#21262d;--bg3:#30363d;
  --tx:#c9d1d9;--tx0:#ffffff;--tx2:#8b949e;--tx3:#6e7681;
  --gold:#d29922;--blue:#58a6ff;--red:#f85149;--green:#3fb950;--purple:#bc8cff;
  --radius:12px;--shadow:0 8px 24px rgba(0,0,0,0.4);
  --font:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
}
html.light{
  --bg:#f6f8fa;--bg1:#ffffff;--bg2:#f0f3f6;--bg3:#e1e4e8;
  --tx:#24292f;--tx0:#000000;--tx2:#57606a;--tx3:#8c959f;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--tx);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;font-size:15px;}
body.modal-open{overflow:hidden;}

/* HEADER */
.header{background:var(--bg1);border-bottom:1px solid var(--bg3);padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:10;}
.logo{font-weight:700;color:var(--tx0);font-size:16px;display:flex;align-items:center;gap:6px;}
.badge{background:var(--bg2);border:1px solid var(--bg3);color:var(--gold);font-size:10px;padding:2px 6px;border-radius:4px;font-weight:bold;}
.header-actions{margin-left:auto;display:flex;gap:8px;}
.btn-icon{background:transparent;border:1px solid transparent;color:var(--tx2);cursor:pointer;width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all 0.2s;user-select:none;-webkit-tap-highlight-color:transparent;}
.btn-icon:hover{background:var(--bg2);border-color:var(--bg3);color:var(--tx0);}

/* MAIN LAYOUT */
.layout{display:flex;flex:1;overflow:hidden;position:relative;}
.sidebar{width:260px;background:var(--bg1);border-right:1px solid var(--bg3);display:flex;flex-direction:column;transition:transform 0.3s;z-index:20;}
.side-tabs{display:flex;border-bottom:1px solid var(--bg3);}
.side-tab{flex:1;padding:10px 0;text-align:center;font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;user-select:none;}
.side-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.side-content{flex:1;overflow-y:auto;padding:10px;}
.side-content.hidden{display:none;}

/* SIDEBAR ITEMS */
.item{padding:10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:4px;transition:background 0.2s;}
.item:hover{background:var(--bg2);}
.item.active{background:var(--bg2);border:1px solid var(--bg3);}
.item-title{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx0);}
.item-sub{font-size:11px;color:var(--tx2);margin-top:2px;}
.btn-new{background:var(--green);color:#fff;border:none;padding:10px;border-radius:8px;font-weight:600;width:100%;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}

/* CHAT AREA */
.chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative;}
.chat-header{padding:12px 20px;border-bottom:1px solid var(--bg3);background:var(--bg1);display:flex;align-items:center;}
.chat-title{font-weight:600;font-size:14px;color:var(--tx0);}
.chat-subtitle{font-size:11px;color:var(--tx2);margin-top:2px;}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;}
.msg{max-width:85%;display:flex;gap:12px;animation:msgIn 0.3s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.msg.user{margin-left:auto;flex-direction:row-reverse;}
.msg.ai{margin-right:auto;}
.avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.msg.user .avatar{background:var(--blue);color:#fff;}
.msg.ai .avatar{background:var(--bg2);border:1px solid var(--bg3);}
.bubble{padding:12px 16px;border-radius:var(--radius);font-size:14px;line-height:1.6;box-shadow:0 1px 2px rgba(0,0,0,0.1);overflow-wrap:break-word;}
.msg.user .bubble{background:var(--blue);color:#fff;border-top-right-radius:4px;}
.msg.ai .bubble{background:var(--bg1);border:1px solid var(--bg3);border-top-left-radius:4px;color:var(--tx);}

/* MARKDOWN STYLES */
.bubble p{margin-bottom:10px;}
.bubble p:last-child{margin-bottom:0;}
.bubble pre{background:var(--bg);border:1px solid var(--bg3);border-radius:8px;padding:12px;overflow-x:auto;margin:10px 0;font-family:var(--mono);font-size:13px;}
.bubble code{background:var(--bg2);padding:2px 5px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--gold);}
.bubble pre code{background:transparent;padding:0;color:var(--tx);}
.bubble table{border-collapse:collapse;width:100%;margin:10px 0;}
.bubble th,.bubble td{border:1px solid var(--bg3);padding:8px;text-align:left;}
.bubble th{background:var(--bg2);}
.bubble blockquote{border-left:4px solid var(--gold);padding-left:10px;color:var(--tx2);margin:10px 0;}
.bubble ul,.bubble ol{padding-left:20px;margin-bottom:10px;}

/* INPUT AREA */
.input-area{padding:16px 20px;background:var(--bg1);border-top:1px solid var(--bg3);}
.input-box{display:flex;align-items:flex-end;gap:8px;background:var(--bg);border:1px solid var(--bg3);border-radius:var(--radius);padding:8px 12px;transition:border-color 0.2s;}
.input-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 2px rgba(88,166,255,0.2);}
textarea{flex:1;background:transparent;border:none;color:var(--tx0);resize:none;max-height:200px;min-height:24px;padding:6px 0;font-family:var(--font);font-size:15px;line-height:1.5;outline:none;}
textarea::placeholder{color:var(--tx3);}
.btn-send{background:var(--blue);color:#fff;border:none;border-radius:8px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.btn-send:disabled{background:var(--bg3);color:var(--tx3);cursor:not-allowed;}
.btn-send.stop{background:var(--red);}

/* ATTACHMENTS */
.attachments{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.att{background:var(--bg2);border:1px solid var(--bg3);border-radius:6px;padding:4px 8px;font-size:12px;display:flex;align-items:center;gap:6px;}
.att img{width:24px;height:24px;border-radius:4px;object-fit:cover;}
.att .del{cursor:pointer;color:var(--tx3);font-size:14px;}
.att .del:hover{color:var(--red);}

/* MODALS */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-bg.active{display:flex;}
.modal{background:var(--bg1);border:1px solid var(--bg3);border-radius:var(--radius);width:100%;max-width:500px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow);}
.modal-head{padding:16px;border-bottom:1px solid var(--bg3);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-size:16px;font-weight:600;color:var(--tx0);}
.modal-body{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
.modal-foot{padding:16px;border-top:1px solid var(--bg3);display:flex;justify-content:flex-end;gap:10px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
.form-control{width:100%;background:var(--bg);border:1px solid var(--bg3);color:var(--tx0);padding:10px;border-radius:6px;font-family:var(--font);font-size:14px;}
.form-control:focus{outline:none;border-color:var(--blue);}
.btn{padding:8px 16px;border-radius:6px;font-weight:600;cursor:pointer;border:1px solid transparent;font-size:14px;transition:all 0.2s;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-ghost{background:transparent;color:var(--tx);border-color:var(--bg3);}
.btn-ghost:hover{background:var(--bg2);}

/* TOASTS */
.toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{background:var(--bg1);border:1px solid var(--bg3);border-left:4px solid var(--blue);padding:12px 16px;border-radius:6px;font-size:13px;color:var(--tx0);box-shadow:var(--shadow);animation:slideIn 0.3s;}
.toast.error{border-left-color:var(--red);}
@keyframes slideIn{from{transform:translateX(100%);}to{transform:translateX(0);}}

/* MOBILE */
@media(max-width:768px){
  .sidebar{position:absolute;top:0;bottom:0;left:0;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .msg{max-width:95%;}
  .chat-header{padding:10px 16px;}
  #menuBtn{display:block !important;}
}
</style>
</head>
<body>

<header class="header">
  <button type="button" class="btn-icon" onclick="toggleSidebar(event)" style="display:none;" id="menuBtn">☰</button>
  <div class="logo">🤖 AI Asistan <span class="badge">v3.1</span></div>
  <div class="header-actions">
    <button type="button" class="btn-icon" onclick="toggleTheme(event)" title="Tema">🌓</button>
    <button type="button" class="btn-icon" onclick="openModal(event, 'modalSettings')" title="Ayarlar">⚙️</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-tabs">
      <div class="side-tab active" onclick="switchTab(event, 'chats')">💬 Sohbetler</div>
      <div class="side-tab" onclick="switchTab(event, 'personas')">🎭 Asistanlar</div>
    </div>
    
    <div class="side-content" id="tabChats">
      <button type="button" class="btn-new" onclick="newChat(event)">➕ Yeni Sohbet</button>
      <div id="chatList"></div>
    </div>
    
    <div class="side-content hidden" id="tabPersonas">
      <button type="button" class="btn-new" onclick="newPersona(event)" style="background:var(--purple);">➕ Yeni Asistan</button>
      <div id="personaList"></div>
    </div>
  </aside>

  <main class="chat-area">
    <div class="chat-header">
      <div>
        <div class="chat-title" id="currentChatTitle">Yeni Sohbet</div>
        <div class="chat-subtitle" id="currentChatMeta">Gemini 2.0 Flash</div>
      </div>
      <button type="button" class="btn-icon" onclick="clearChat(event)" style="margin-left:auto;" title="Sohbeti Temizle">🧹</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="attachments" id="attachList"></div>
      <div class="input-box">
        <button type="button" class="btn-icon" onclick="document.getElementById('fileInput').click()" title="Dosya/Görsel Ekle">📎</button>
        <textarea id="promptInput" placeholder="Mesajınızı yazın... (Shift+Enter: Alt satır)" rows="1" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
        <button type="button" class="btn-send" id="sendBtn" onclick="handleSend(event)" disabled>➤</button>
      </div>
    </div>
  </main>
</div>

<input type="file" id="fileInput" multiple accept=".txt,.js,.css,.html,.json,.md,image/*" style="display:none;" onchange="handleFiles(event, this.files)">

<!-- MODAL: SETTINGS -->
<div class="modal-bg" id="modalSettings" onclick="bgClickClose(event, 'modalSettings')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div class="modal-title">⚙️ Ayarlar</div>
      <button type="button" class="btn-icon" onclick="closeModal(event, 'modalSettings')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Sağlayıcı & Model</label>
        <select class="form-control" id="setProv" onchange="updateModelList(event)" style="margin-bottom:8px;">
          <option value="gemini">Google Gemini (Ücretsiz)</option>
          <option value="openai">OpenAI (Ücretli)</option>
        </select>
        <select class="form-control" id="setModel"></select>
      </div>
      <div class="form-group">
        <label>API Anahtarı</label>
        <input type="password" class="form-control" id="setKey" placeholder="AIza...">
        <div style="font-size:11px;color:var(--tx3);margin-top:4px;">Anahtar tarayıcınızda saklanır. Gömülü anahtar çalışmazsa buraya yenisini yapıştırın.</div>
      </div>
      <div class="form-group">
        <label>Bağlam (Hafıza) Uzunluğu: <span id="ctxVal">10</span> mesaj</label>
        <input type="range" id="setCtx" min="2" max="50" step="2" value="10" oninput="document.getElementById('ctxVal').innerText=this.value" style="width:100%;">
        <div style="font-size:11px;color:var(--tx3);">Yapay zekanın kaç önceki mesajı hatırlayacağını belirler. Yüksek değer = daha iyi hafıza, daha çok token.</div>
      </div>
      <div class="form-group">
        <label>Yaratıcılık (Sıcaklık): <span id="tempVal">0.7</span></label>
        <input type="range" id="setTemp" min="0" max="1" step="0.1" value="0.7" oninput="document.getElementById('tempVal').innerText=this.value" style="width:100%;">
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" onclick="closeModal(event, 'modalSettings')">İptal</button>
      <button type="button" class="btn btn-primary" onclick="saveSettings(event)">Kaydet</button>
    </div>
  </div>
</div>

<!-- MODAL: PERSONA -->
<div class="modal-bg" id="modalPersona" onclick="bgClickClose(event, 'modalPersona')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div class="modal-title" id="personaModalTitle">🎭 Asistan Düzenle</div>
      <button type="button" class="btn-icon" onclick="closeModal(event, 'modalPersona')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="persId">
      <div class="form-group">
        <label>Asistan Adı</label>
        <input type="text" class="form-control" id="persName" placeholder="Örn: Kıdemli Yazılımcı">
      </div>
      <div class="form-group">
        <label>İkon (Emoji)</label>
        <input type="text" class="form-control" id="persIcon" placeholder="👨‍💻" maxlength="4">
      </div>
      <div class="form-group">
        <label>Sistem Promptu (Görevi)</label>
        <textarea class="form-control" id="persPrompt" rows="6" placeholder="Sen uzman bir yazılımcısın. Kodları temiz ve optimize yazarsın..."></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" onclick="closeModal(event, 'modalPersona')">İptal</button>
      <button type="button" class="btn btn-primary" onclick="savePersona(event)">Kaydet</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
/* === SABİTLER & DURUM === */
const EMBEDDED_KEY = 'AQ.Ab8RN6KTOG0Zoo--lzgyBhiXPP7zq4NVb8m8Mg3J8hE-lmMlxw';
const K = { data:'aiv3_data', theme:'aiv3_theme' };

const DEFAULT_PERSONAS = [
  { id:'general', icon:'🤖', name:'Genel Asistan', prompt:'Sen yardımcı bir yapay zeka asistanısın. Türkçe, kısa ve net cevap ver. Kod sorulursa markdown kod bloğu kullan.' },
  { id:'coder', icon:'👨‍💻', name:'Uzman Yazılımcı', prompt:'Sen kıdemli bir yazılım mühendisisin. Sorunları analiz et, temiz ve çalışır kod yaz. Sadece kod verme, kısa bir açıklama da ekle. Hata ayıklarken nedenini belirt.' },
  { id:'game', icon:'🎮', name:'Oyun Uzmanı', prompt:'Sen "Bilâd-ı Mütenâfise" isimli gerçek zamanlı Türkçe strateji oyununun uzmanısın. Oyunculara strateji, ekonomi yönetimi, savaş taktikleri ve kod (HTML/JS) konularında yardım edersin. Her zaman pratik ve uygulanabilir tavsiyeler ver.' }
];

let State = {
  settings: { provider:'gemini', model:'gemini-2.0-flash-exp', key:EMBEDDED_KEY, ctx:10, temp:0.7 },
  personas: [...DEFAULT_PERSONAS],
  chats: [],
  activeChatId: null,
  busy: false,
  abortCtrl: null,
  attachments: []
};

/* === BAŞLANGIÇ === */
function init() {
  try {
    const saved = localStorage.getItem(K.data);
    if (saved) {
      const parsed = JSON.parse(saved);
      State.settings = { ...State.settings, ...parsed.settings };
      State.personas = parsed.personas || [...DEFAULT_PERSONAS];
      State.chats = parsed.chats || [];
      State.activeChatId = parsed.activeChatId;
    }
    
    if (!State.settings.key) State.settings.key = EMBEDDED_KEY;
    if (localStorage.getItem(K.theme) === 'light') document.documentElement.classList.add('light');
    
    if(window.innerWidth <= 768) document.getElementById('menuBtn').style.display = 'block';

    if (!State.chats.length) newChat();
    else renderAll();
    
    // Ayarları doldur
    document.getElementById('setProv').value = State.settings.provider;
    updateModelList();
    document.getElementById('setKey').value = State.settings.key;
    document.getElementById('setCtx').value = State.settings.ctx;
    document.getElementById('ctxVal').innerText = State.settings.ctx;
    document.getElementById('setTemp').value = State.settings.temp;
    document.getElementById('tempVal').innerText = State.settings.temp;
    
    if(State.activeChatId) {
      const c = State.chats.find(x=>x.id===State.activeChatId);
      if(c && c.msgs.length === 0) showWelcome();
    }
  } catch(e) {
    console.error("Başlatma hatası:", e);
    alert("Başlatılırken bir hata oluştu: " + e.message);
  }
}

function save() {
  try {
    localStorage.setItem(K.data, JSON.stringify({
      settings: State.settings,
      personas: State.personas,
      chats: State.chats,
      activeChatId: State.activeChatId
    }));
  } catch(e) { console.warn("Kayıt hatası:", e); }
}

/* === SOHBET YÖNETİMİ === */
function newChat(e) {
  if(e) e.preventDefault();
  const c = {
    id: Date.now().toString(),
    title: 'Yeni Sohbet',
    personaId: 'general',
    msgs: [],
    created: Date.now()
  };
  State.chats.unshift(c);
  State.activeChatId = c.id;
  save();
  renderAll();
  showWelcome();
  const sb = document.getElementById('sidebar');
  if(sb) sb.classList.remove('open');
  document.getElementById('promptInput').focus();
}

function deleteChat(id, e) {
  if(e) e.stopPropagation();
  if(!confirm('Bu sohbet silinsin mi?')) return;
  State.chats = State.chats.filter(x => x.id !== id);
  if (State.activeChatId === id) {
    State.activeChatId = State.chats[0]?.id || null;
    if (!State.activeChatId) newChat(null); else renderAll();
  } else {
    renderAll();
  }
  save();
}

function selectChat(id, e) {
  if(e) e.preventDefault();
  State.activeChatId = id;
  save();
  renderAll();
  const sb = document.getElementById('sidebar');
  if(sb) sb.classList.remove('open');
}

function getActiveChat() {
  return State.chats.find(x => x.id === State.activeChatId);
}

/* === RENDER === */
function renderAll() {
  renderChatList();
  renderPersonaList();
  renderChatArea();
}

function renderChatList() {
  const list = document.getElementById('chatList');
  list.innerHTML = State.chats.map(c => `
    <div class="item ${c.id === State.activeChatId ? 'active' : ''}" onclick="selectChat('${c.id}', event)">
      <div class="item-title">${escapeHTML(c.title)}</div>
      <button type="button" class="btn-icon" onclick="deleteChat('${c.id}', event)" style="width:24px;height:24px;font-size:12px;">✕</button>
    </div>
  `).join('');
}

function renderPersonaList() {
  const list = document.getElementById('personaList');
  list.innerHTML = State.personas.map(p => `
    <div class="item" onclick="openPersonaModal('${p.id}', event)">
      <div style="font-size:20px;">${p.icon}</div>
      <div style="flex:1;">
        <div class="item-title">${escapeHTML(p.name)}</div>
        <div class="item-sub">${p.id.startsWith('custom_') ? 'Özel' : 'Varsayılan'}</div>
      </div>
    </div>
  `).join('');
}

function renderChatArea() {
  const c = getActiveChat();
  if (!c) return;

  const persona = State.personas.find(p => p.id === c.personaId) || State.personas[0];
  document.getElementById('currentChatTitle').innerText = c.title;
  document.getElementById('currentChatMeta').innerHTML = `${persona.icon} ${persona.name} · ${State.settings.model}`;

  const msgsBox = document.getElementById('messages');
  if (c.msgs.length === 0) {
    msgsBox.innerHTML = '';
    return;
  }

  msgsBox.innerHTML = c.msgs.map(m => {
    let text = m.content;
    if (m.role === 'assistant') {
      text = parseMarkdown(text);
    } else {
      text = escapeHTML(text).replace(/\n/g, '<br>');
    }
    let imgHtml = '';
    if (m.img) imgHtml = `<img src="${m.img}" style="max-width:100%;border-radius:8px;margin-top:8px;">`;
    return `
      <div class="msg ${m.role}">
        <div class="avatar">${m.role === 'user' ? '👤' : persona.icon}</div>
        <div class="bubble">${text}${imgHtml}</div>
      </div>
    `;
  }).join('');
  
  msgsBox.scrollTop = msgsBox.scrollHeight;
}

/* === MESAJLAŞMA === */
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend(e);
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
  document.getElementById('sendBtn').disabled = !el.value.trim() && State.attachments.length === 0;
}

function handleSend(e) {
  if(e) e.preventDefault();
  if (State.busy) {
    if(State.abortCtrl) State.abortCtrl.abort();
    return;
  }
  const input = document.getElementById('promptInput');
  const text = input.value.trim();
  if (!text && State.attachments.length === 0) return;
  
  const c = getActiveChat();
  const persona = State.personas.find(p => p.id === c.personaId) || State.personas[0];

  const userMsg = { role: 'user', content: text, t: Date.now() };
  const imgAtt = State.attachments.find(a => a.isImg);
  if (imgAtt) userMsg.img = imgAtt.content;

  c.msgs.push(userMsg);
  
  if (c.msgs.length === 1) {
    c.title = text.slice(0, 30) || 'Görsel Analizi';
  }

  input.value = '';
  input.style.height = 'auto';
  State.attachments = [];
  renderAttachments();
  document.getElementById('sendBtn').disabled = true;
  
  renderChatArea();
  save();
  
  fetchAI(c, persona);
}

async function fetchAI(chat, persona) {
  State.busy = true;
  State.abortCtrl = new AbortController();
  
  const btn = document.getElementById('sendBtn');
  btn.className = 'btn-send stop';
  btn.innerHTML = '⏹';
  btn.disabled = false;

  const aiMsg = { role: 'assistant', content: '', t: Date.now() };
  chat.msgs.push(aiMsg);
  renderChatArea();

  const msgsBox = document.getElementById('messages');
  const lastBubble = msgsBox.lastElementChild.querySelector('.bubble');
  lastBubble.innerHTML = '<span style="color:var(--tx3);">Düşünüyor...</span>';

  let contextMsgs = [];
  const ctxLimit = parseInt(State.settings.ctx) || 10;
  const history = chat.msgs.filter(m => m !== aiMsg);
  const startIdx = Math.max(0, history.length - ctxLimit);
  
  for (let i = startIdx; i < history.length; i++) {
    const m = history[i];
    contextMsgs.push({ role: m.role, content: m.content, img: m.img });
  }

  try {
    const stream = callAPI(persona.prompt, contextMsgs, State.abortCtrl.signal);
    let fullText = '';
    
    for await (const chunk of stream) {
      fullText += chunk;
      lastBubble.innerHTML = parseMarkdown(fullText) + '<span style="display:inline-block;width:8px;height:14px;background:var(--gold);animation:blink 1s infinite;vertical-align:middle;margin-left:4px;"></span>';
      msgsBox.scrollTop = msgsBox.scrollHeight;
    }
    aiMsg.content = fullText;
  } catch (err) {
    if (err.name === 'AbortError') {
      aiMsg.content = (aiMsg.content || '') + '\n\n*[Durduruldu]*';
    } else {
      console.error(err);
      let errMsg = err.message;
      if(errMsg.includes('API key not valid')) errMsg = 'Geçersiz API Anahtarı! Lütfen ayarlardan kontrol edin.';
      else if(errMsg.includes('quota')) errMsg = 'Kota aşıldı. Lütfen biraz bekleyin.';
      aiMsg.content = `⚠️ **Hata:** ${errMsg}`;
      toast(errMsg, 'error');
    }
  } finally {
    State.busy = false;
    State.abortCtrl = null;
    btn.className = 'btn-send';
    btn.innerHTML = '➤';
    renderChatArea();
    save();
  }
}

/* === API ÇAĞRISI (STREAMING) === */
async function* callAPI(sysPrompt, messages, signal) {
  const prov = State.settings.provider;
  const model = State.settings.model;
  const key = State.settings.key;
  const temp = parseFloat(State.settings.temp);

  if (prov === 'gemini') {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${key}`;
    const body = {
      systemInstruction: { parts: [{ text: sysPrompt }] },
      contents: messages.map(m => {
        const parts = [];
        if (m.content) parts.push({ text: m.content });
        if (m.img) {
           const mime = m.img.split(';')[0].split(':')[1];
           const data = m.img.split(',')[1];
           parts.push({ inlineData: { mimeType: mime, data: data } });
        }
        return { role: m.role === 'user' ? 'user' : 'model', parts };
      }),
      generationConfig: { temperature: temp, maxOutputTokens: 4096 }
    };

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal,
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const errText = await res.text();
      let msg = 'HTTP ' + res.status;
      try { msg = JSON.parse(errText).error.message; } catch(e){}
      throw new Error(msg);
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data:')) {
          const dataStr = line.slice(5).trim();
          if (!dataStr) continue;
          try {
            const json = JSON.parse(dataStr);
            const txt = json.candidates?.[0]?.content?.parts?.[0]?.text;
            if (txt) yield txt;
          } catch (e) {}
        }
      }
    }
  } else if (prov === 'openai') {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      signal,
      body: JSON.stringify({
        model: model,
        messages: [{ role: 'system', content: sysPrompt }, ...messages.map(m => ({ role: m.role, content: m.content }))],
        temperature: temp,
        stream: true
      })
    });

    if (!res.ok) {
      const errText = await res.text();
      let msg = 'HTTP ' + res.status;
      try { msg = JSON.parse(errText).error.message; } catch(e){}
      throw new Error(msg);
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const dataStr = line.slice(6).trim();
          if (dataStr === '[DONE]') return;
          try {
            const json = JSON.parse(dataStr);
            const txt = json.choices?.[0]?.delta?.content;
            if (txt) yield txt;
          } catch (e) {}
        }
      }
    }
  }
}

/* === YARDIMCILAR === */
function escapeHTML(str) {
  return str.replace(/[&<>'"]/g, tag => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[tag]));
}

function parseMarkdown(text) {
  if (!text) return '';
  let h = text;
  const blocks = [];
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const i = blocks.length;
    blocks.push(`<pre><code>${escapeHTML(code)}</code></pre>`);
    return `__BLOCK_${i}__`;
  });
  
  h = escapeHTML(h);
  
  h = h.replace(/^### (.*)$/gm, '<h3 style="color:var(--gold);margin:10px 0 5px;font-size:16px;">$1</h3>');
  h = h.replace(/^## (.*)$/gm, '<h2 style="color:var(--gold);margin:12px 0 6px;font-size:18px;">$1</h2>');
  h = h.replace(/^# (.*)$/gm, '<h1 style="color:var(--gold);margin:14px 0 8px;font-size:20px;">$1</h1>');
  h = h.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.*?)\*/g, '<em>$1</em>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/^- (.*)$/gm, '<li>$1</li>').replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  h = h.replace(/^\d+\. (.*)$/gm, '<li>$1</li>').replace(/(<li>.*<\/li>)/s, '<ol>$1</ol>');
  h = h.replace(/\n/g, '<br>');
  
  h = h.replace(/\|(.+)\|\n\|[-| ]+\|\n((?:\|.*\|\n?)*)/g, (match, head, body) => {
    const ths = head.split('|').filter(x=>x.trim()).map(x=>`<th>${x.trim()}</th>`).join('');
    const trs = body.trim().split('\n').map(row => {
      const tds = row.split('|').filter(x=>x.trim()).map(x=>`<td>${x.trim()}</td>`).join('');
      return `<tr>${tds}</tr>`;
    }).join('');
    return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
  });

  blocks.forEach((b, i) => {
    h = h.replace(`__BLOCK_${i}__`, b);
  });

  return h;
}

function toast(msg, type='') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerText = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(()=>t.remove(), 300); }, 3000);
}

function handleFiles(e, files) {
  if(e) e.preventDefault();
  for (const f of files) {
    if (f.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = ev => {
        State.attachments.push({ name: f.name, content: ev.target.result, isImg: true });
        renderAttachments();
      };
      reader.readAsDataURL(f);
    } else {
      const reader = new FileReader();
      reader.onload = ev => {
        State.attachments.push({ name: f.name, content: ev.target.result, isImg: false });
        renderAttachments();
      };
      reader.readAsText(f);
    }
  }
  document.getElementById('fileInput').value = '';
}

function renderAttachments() {
  const box = document.getElementById('attachList');
  box.innerHTML = State.attachments.map((a, i) => `
    <div class="att">
      ${a.isImg ? `<img src="${a.content}">` : '📄'}
      <span>${a.name}</span>
      <button type="button" class="del" onclick="State.attachments.splice(${i},1);renderAttachments();" style="background:none;border:none;">✕</button>
    </div>
  `).join('');
  document.getElementById('sendBtn').disabled = !document.getElementById('promptInput').value.trim() && State.attachments.length === 0;
}

/* === ARAYÜZ ETKİLEŞİMLERİ === */
function toggleSidebar(e) { 
  if(e) e.preventDefault();
  document.getElementById('sidebar').classList.toggle('open'); 
}

function switchTab(e, tab) {
  if(e) e.preventDefault();
  document.querySelectorAll('.side-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.side-content').forEach(c => c.classList.add('hidden'));
  if(tab === 'chats') {
    document.querySelectorAll('.side-tab')[0].classList.add('active');
    document.getElementById('tabChats').classList.remove('hidden');
  } else {
    document.querySelectorAll('.side-tab')[1].classList.add('active');
    document.getElementById('tabPersonas').classList.remove('hidden');
  }
}

function openModal(e, id) { 
  if(e) { e.preventDefault(); e.stopPropagation(); }
  const el = document.getElementById(id);
  if(el) {
    el.classList.add('active'); 
    document.body.classList.add('modal-open');
  }
}

function closeModal(e, id) { 
  if(e) { e.preventDefault(); e.stopPropagation(); }
  const el = document.getElementById(id);
  if(el) {
    el.classList.remove('active'); 
    document.body.classList.remove('modal-open');
  }
}

function bgClickClose(e, id) {
  if(e.target.id === id) closeModal(e, id);
}

function toggleTheme(e) {
  if(e) e.preventDefault();
  const isLight = document.documentElement.classList.toggle('light');
  localStorage.setItem(K.theme, isLight ? 'light' : 'dark');
}

function clearChat(e) {
  if(e) e.preventDefault();
  const c = getActiveChat();
  if(!c || !c.msgs.length) return;
  if(confirm('Tüm mesajlar silinsin mi?')) {
    c.msgs = [];
    c.title = 'Yeni Sohbet';
    renderAll();
    save();
    showWelcome();
  }
}

function showWelcome() {
  const c = getActiveChat();
  if(!c || c.msgs.length > 0) return;
  const persona = State.personas.find(p => p.id === c.personaId) || State.personas[0];
  
  document.getElementById('messages').innerHTML = `
    <div style="text-align:center;padding:40px 20px;color:var(--tx2);">
      <div style="font-size:48px;margin-bottom:16px;">${persona.icon}</div>
      <h2 style="color:var(--tx0);margin-bottom:8px;">${persona.name}</h2>
      <p style="font-size:14px;max-width:400px;margin:0 auto;line-height:1.5;">${persona.prompt}</p>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:24px;flex-wrap:wrap;">
        <button type="button" class="btn btn-ghost" onclick="quickPrompt(event, 'Merhaba, kendini tanıt.')">Merhaba</button>
        <button type="button" class="btn btn-ghost" onclick="quickPrompt(event, 'Bana kısa bir hikaye yaz.')">Hikaye yaz</button>
        <button type="button" class="btn btn-ghost" onclick="quickPrompt(event, 'JavaScript ile bir sayının asal olup olmadığını bulan fonksiyon yaz.')">Kod yaz</button>
      </div>
    </div>
  `;
}

function quickPrompt(e, text) {
  if(e) e.preventDefault();
  document.getElementById('promptInput').value = text;
  autoResize(document.getElementById('promptInput'));
  handleSend(null);
}

/* === AYARLAR === */
function updateModelList(e) {
  if(e) e.preventDefault();
  const prov = document.getElementById('setProv').value;
  const sel = document.getElementById('setModel');
  const models = {
    gemini: ['gemini-2.0-flash-exp', 'gemini-1.5-flash', 'gemini-1.5-pro'],
    openai: ['gpt-4o-mini', 'gpt-4o']
  };
  sel.innerHTML = models[prov].map(m => `<option value="${m}" ${State.settings.model===m?'selected':''}>${m}</option>`).join('');
}

function saveSettings(e) {
  if(e) e.preventDefault();
  State.settings.provider = document.getElementById('setProv').value;
  State.settings.model = document.getElementById('setModel').value;
  State.settings.key = document.getElementById('setKey').value.trim();
  State.settings.ctx = parseInt(document.getElementById('setCtx').value);
  State.settings.temp = parseFloat(document.getElementById('setTemp').value);
  
  save();
  closeModal(null, 'modalSettings');
  renderChatArea();
  toast('Ayarlar kaydedildi', '');
}

/* === PERSONA YÖNETİMİ === */
function newPersona(e) {
  if(e) e.preventDefault();
  document.getElementById('persId').value = 'custom_' + Date.now();
  document.getElementById('persName').value = '';
  document.getElementById('persIcon').value = '🧠';
  document.getElementById('persPrompt').value = '';
  document.getElementById('personaModalTitle').innerText = 'Yeni Asistan';
  openModal(null, 'modalPersona');
}

function openPersonaModal(id, e) {
  if(e) e.preventDefault();
  const p = State.personas.find(x => x.id === id);
  if (!p) return;
  document.getElementById('persId').value = p.id;
  document.getElementById('persName').value = p.name;
  document.getElementById('persIcon').value = p.icon;
  document.getElementById('persPrompt').value = p.prompt;
  document.getElementById('personaModalTitle').innerText = 'Asistanı Düzenle';
  openModal(null, 'modalPersona');
}

function savePersona(e) {
  if(e) e.preventDefault();
  const id = document.getElementById('persId').value;
  const name = document.getElementById('persName').value.trim();
  const icon = document.getElementById('persIcon').value.trim() || '🤖';
  const prompt = document.getElementById('persPrompt').value.trim();
  
  if (!name || !prompt) return toast('İsim ve Prompt zorunludur', 'error');
  
  const idx = State.personas.findIndex(x => x.id === id);
  if (idx > -1) {
    State.personas[idx] = { id, name, icon, prompt };
  } else {
    State.personas.push({ id, name, icon, prompt });
  }
  
  save();
  renderPersonaList();
  closeModal(null, 'modalPersona');
  toast('Asistan kaydedildi', '');
  
  const c = getActiveChat();
  if (c && c.personaId === id) renderChatArea();
}

window.addEventListener('error', function(e) {
  console.error("Global Hata:", e.message);
});

// Başlat
window.addEventListener('DOMContentLoaded', init);
