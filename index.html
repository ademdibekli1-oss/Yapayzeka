<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Asistan v5.1 Ultimate</title>
<meta name="theme-color" content="#161b22">
<link rel="manifest" href='data:application/manifest+json,{"name":"AI Asistan","short_name":"AI","start_url":".","display":"standalone","background_color":"#0d1117","theme_color":"#161b22","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/4712/4712035.png","sizes":"512x512","type":"image/png"}]}'>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
/* =========================================
   DEĞİŞKENLER VE TEMEL AYARLAR
   ========================================= */
:root {
  --bg: #0d1117;
  --bg1: #161b22;
  --bg2: #21262d;
  --bg3: #30363d;
  --tx: #c9d1d9;
  --tx0: #ffffff;
  --tx2: #8b949e;
  --tx3: #6e7681;
  --gold: #d29922;
  --blue: #58a6ff;
  --red: #f85149;
  --green: #3fb950;
  --purple: #bc8cff;
  --radius: 12px;
  --shadow: 0 8px 24px rgba(0,0,0,0.4);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
}

html.light {
  --bg: #f6f8fa;
  --bg1: #ffffff;
  --bg2: #f0f3f6;
  --bg3: #e1e4e8;
  --tx: #24292f;
  --tx0: #000000;
  --tx2: #57606a;
  --tx3: #8c959f;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--tx);
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-size: 15px;
}

body.modal-open {
  overflow: hidden;
}

/* =========================================
   HEADER
   ========================================= */
.header {
  background: var(--bg1);
  border-bottom: 1px solid var(--bg3);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 10;
}

.logo {
  font-weight: 700;
  color: var(--tx0);
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.badge {
  background: var(--bg2);
  border: 1px solid var(--bg3);
  color: var(--gold);
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: bold;
}

.header-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
}

.btn-icon {
  background: transparent;
  border: 1px solid transparent;
  color: var(--tx2);
  cursor: pointer;
  width: 32px;
  height: 32px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
  user-select: none;
}

.btn-icon:hover {
  background: var(--bg2);
  border-color: var(--bg3);
  color: var(--tx0);
}

/* =========================================
   ANA LAYOUT
   ========================================= */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* =========================================
   SOL MENÜ (SIDEBAR)
   ========================================= */
.sidebar {
  width: 280px;
  background: var(--bg1);
  border-right: 1px solid var(--bg3);
  display: flex;
  flex-direction: column;
  transition: transform 0.3s;
  z-index: 20;
}

.side-tabs {
  display: flex;
  border-bottom: 1px solid var(--bg3);
}

.side-tab {
  flex: 1;
  padding: 10px 0;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--tx2);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  user-select: none;
}

.side-tab.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}

.side-content {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.side-content.hidden {
  display: none;
}

.item {
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
  transition: background 0.2s;
}

.item:hover {
  background: var(--bg2);
}

.item.active {
  background: var(--bg2);
  border: 1px solid var(--bg3);
}

.item-title {
  flex: 1;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--tx0);
}

.item-sub {
  font-size: 11px;
  color: var(--tx2);
  margin-top: 2px;
}

.btn-new {
  background: var(--green);
  color: #fff;
  border: none;
  padding: 10px;
  border-radius: 8px;
  font-weight: 600;
  width: 100%;
  margin-bottom: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

/* =========================================
   SOHBET ALANI (CHAT AREA)
   ========================================= */
.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
}

.chat-header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--bg3);
  background: var(--bg1);
  display: flex;
  align-items: center;
}

.chat-title {
  font-weight: 600;
  font-size: 14px;
  color: var(--tx0);
}

.chat-subtitle {
  font-size: 11px;
  color: var(--tx2);
  margin-top: 2px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

.msg {
  max-width: 85%;
  display: flex;
  gap: 12px;
  animation: msgIn 0.3s ease;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.user { margin-left: auto; flex-direction: row-reverse; }
.msg.ai { margin-right: auto; }

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.msg.user .avatar { background: var(--blue); color: #fff; }
.msg.ai .avatar { background: var(--bg2); border: 1px solid var(--bg3); }

.bubble {
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.6;
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  overflow-wrap: break-word;
  position: relative;
}

.msg.user .bubble {
  background: var(--blue);
  color: #fff;
  border-top-right-radius: 4px;
}

.msg.ai .bubble {
  background: var(--bg1);
  border: 1px solid var(--bg3);
  border-top-left-radius: 4px;
  color: var(--tx);
}

/* Mesaj Altı Butonlar */
.msg-actions {
  display: flex;
  gap: 4px;
  margin-top: 8px;
  opacity: 0;
  transition: opacity 0.2s;
}

.bubble:hover .msg-actions { opacity: 1; }

.msg-actions button {
  background: var(--bg2);
  border: 1px solid var(--bg3);
  color: var(--tx2);
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 11px;
  cursor: pointer;
}

.msg-actions button:hover { background: var(--bg3); color: var(--tx0); }

/* =========================================
   MARKDOWN & KOD BLOKLARI
   ========================================= */
.bubble p { margin-bottom: 10px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble code {
  background: var(--bg2);
  padding: 2px 5px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--gold);
}
.bubble table { border-collapse: collapse; width: 100%; margin: 10px 0; }
.bubble th, .bubble td { border: 1px solid var(--bg3); padding: 8px; text-align: left; }
.bubble th { background: var(--bg2); }
.bubble blockquote {
  border-left: 4px solid var(--gold);
  padding-left: 10px;
  color: var(--tx2);
  margin: 10px 0;
}
.bubble ul, .bubble ol { padding-left: 20px; margin-bottom: 10px; }

/* Kod Çalıştırıcı (Sandbox) */
.code-wrap {
  margin: 10px 0;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--bg3);
}
.code-head {
  background: var(--bg2);
  padding: 6px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--tx2);
}
.code-head button {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 4px 10px;
  cursor: pointer;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
}
.code-head button:hover { filter: brightness(1.2); }
.code-wrap pre {
  margin: 0;
  padding: 12px;
  overflow-x: auto;
  background: var(--bg);
}
.code-wrap code { background: transparent; color: var(--tx); padding: 0; }

/* =========================================
   GİRİŞ ALANI (INPUT AREA)
   ========================================= */
.input-area {
  padding: 16px 20px;
  background: var(--bg1);
  border-top: 1px solid var(--bg3);
}

.attachments {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.att {
  background: var(--bg2);
  border: 1px solid var(--bg3);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.att img { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; }
.att .del { cursor: pointer; color: var(--tx3); font-size: 14px; }
.att .del:hover { color: var(--red); }

.input-box {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--bg);
  border: 1px solid var(--bg3);
  border-radius: var(--radius);
  padding: 8px 12px;
  transition: border-color 0.2s;
}

.input-box:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px rgba(88,166,255,0.2);
}

textarea {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--tx0);
  resize: none;
  max-height: 200px;
  min-height: 24px;
  padding: 6px 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  outline: none;
}
textarea::placeholder { color: var(--tx3); }

.btn-send {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  width: 32px;
  height: 32px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.btn-send:disabled { background: var(--bg3); color: var(--tx3); cursor: not-allowed; }
.btn-send.stop { background: var(--red); }
.btn-mic.recording { background: var(--red); color: #fff; animation: pulse 1s infinite; }

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

/* Token & Maliyet Göstergesi */
.cost-info {
  font-size: 11px;
  color: var(--tx3);
  text-align: right;
  margin-top: 6px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

/* =========================================
   MODALLER
   ========================================= */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal-bg.active { display: flex; }

.modal {
  background: var(--bg1);
  border: 1px solid var(--bg3);
  border-radius: var(--radius);
  width: 100%;
  max-width: 550px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
}
.modal.wide { max-width: 800px; }

.modal-head {
  padding: 16px;
  border-bottom: 1px solid var(--bg3);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-title { font-size: 16px; font-weight: 600; color: var(--tx0); }
.modal-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.modal-foot { padding: 16px; border-top: 1px solid var(--bg3); display: flex; justify-content: flex-end; gap: 10px; }

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--tx2);
  margin-bottom: 6px;
  text-transform: uppercase;
}

.form-control {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--bg3);
  color: var(--tx0);
  padding: 10px;
  border-radius: 6px;
  font-family: var(--font);
  font-size: 14px;
}
.form-control:focus { outline: none; border-color: var(--blue); }

.btn {
  padding: 8px 16px;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  font-size: 14px;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { filter: brightness(1.1); }
.btn-ghost { background: transparent; color: var(--tx); border-color: var(--bg3); }
.btn-ghost:hover { background: var(--bg2); }

#iframeSandbox { width: 100%; height: 100%; border: none; background: #fff; border-radius: 0 0 var(--radius) var(--radius); }

/* =========================================
   TOAST (BİLDİRİM)
   ========================================= */
.toasts {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 200;
}
.toast {
  background: var(--bg1);
  border: 1px solid var(--bg3);
  border-left: 4px solid var(--blue);
  padding: 12px 16px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--tx0);
  box-shadow: var(--shadow);
  animation: slideIn 0.3s;
}
.toast.error { border-left-color: var(--red); }

@keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

/* Sürükle Bırak Alanı */
.drop-overlay {
  position: fixed;
  inset: 0;
  background: rgba(88,166,255,0.1);
  border: 4px dashed var(--blue);
  z-index: 999;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: bold;
  color: var(--blue);
  pointer-events: none;
}
.drop-overlay.active { display: flex; }

/* =========================================
   MOBİL UYUMLULUK
   ========================================= */
@media(max-width: 768px) {
  .sidebar {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    transform: translateX(-100%);
    width: 260px;
    box-shadow: var(--shadow);
  }
  .sidebar.open { transform: translateX(0); }
  .msg { max-width: 95%; }
  #menuBtn { display: block !important; }
}
</style>
</head>
<body>

<!-- BAŞLIK -->
<header class="header">
  <button type="button" class="btn-icon" onclick="toggleSidebar(event)" style="display:none;" id="menuBtn">☰</button>
  <div class="logo">🤖 AI Asistan <span class="badge">v5.1</span></div>
  <div class="header-actions">
    <button type="button" class="btn-icon" onclick="toggleTheme(event)" title="Tema Değiştir">🌓</button>
    <button type="button" class="btn-icon" onclick="openModal(event, 'modalSettings')" title="Ayarlar">⚙️</button>
  </div>
</header>

<!-- ANA GÖVDE -->
<div class="layout">
  <!-- SOL MENÜ -->
  <aside class="sidebar" id="sidebar">
    <div class="side-tabs">
      <div class="side-tab active" onclick="switchTab(event, 'chats')">💬 Sohbet</div>
      <div class="side-tab" onclick="switchTab(event, 'personas')">🎭 Asistan</div>
      <div class="side-tab" onclick="switchTab(event, 'prompts')">📚 Şablon</div>
    </div>
    
    <div class="side-content" id="tabChats">
      <button type="button" class="btn-new" onclick="newChat(event)">➕ Yeni Sohbet</button>
      <div id="chatList"></div>
    </div>
    
    <div class="side-content hidden" id="tabPersonas">
      <button type="button" class="btn-new" onclick="newPersona(event)" style="background:var(--purple);">➕ Yeni Asistan</button>
      <div id="personaList"></div>
    </div>

    <div class="side-content hidden" id="tabPrompts">
      <div id="promptList"></div>
    </div>
  </aside>

  <!-- SOHBET ALANI -->
  <main class="chat-area">
    <div class="chat-header">
      <div>
        <div class="chat-title" id="currentChatTitle">Yeni Sohbet</div>
        <div class="chat-subtitle" id="currentChatMeta">Gemini 3.8 Flash</div>
      </div>
      <div style="margin-left:auto; display:flex; gap:8px;">
        <button type="button" class="btn-icon" onclick="exportChat(event)" title="Markdown Olarak İndir">📤</button>
        <button type="button" class="btn-icon" onclick="clearChat(event)" title="Sohbeti Temizle">🧹</button>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="attachments" id="attachList"></div>
      <div class="input-box">
        <button type="button" class="btn-icon" onclick="document.getElementById('fileInput').click()" title="Dosya / PDF / Görsel Ekle">📎</button>
        <button type="button" class="btn-icon btn-mic" id="micBtn" onclick="toggleMic(event)" title="Sesli Yaz">🎤</button>
        <textarea id="promptInput" placeholder="Mesajınızı yazın... (Enter: Gönder, Shift+Enter: Alt Satır)" rows="1" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
        <button type="button" class="btn-send" id="sendBtn" onclick="handleSend(event)" disabled>➤</button>
      </div>
      <div class="cost-info" id="costInfo"></div>
    </div>
  </main>
</div>

<!-- Sürükle Bırak Katmanı -->
<div class="drop-overlay" id="dropOverlay">📁 Dosyayı Buraya Bırak</div>

<!-- Gizli Dosya Girişi -->
<input type="file" id="fileInput" multiple accept=".txt,.js,.css,.html,.json,.md,.pdf,image/*" style="display:none;" onchange="handleFiles(event, this.files)">

<!-- AYARLAR MODALI -->
<div class="modal-bg" id="modalSettings" onclick="bgClickClose(event, 'modalSettings')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div class="modal-title">⚙️ Ayarlar</div>
      <button type="button" class="btn-icon" onclick="closeModal(event, 'modalSettings')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Sağlayıcı & Model</label>
        <select class="form-control" id="setProv" onchange="updateModelList(event)" style="margin-bottom:8px;">
          <option value="gemini">Google Gemini</option>
          <option value="openai">OpenAI</option>
        </select>
        <select class="form-control" id="setModel"></select>
      </div>
      
      <div class="form-group">
        <label>API Anahtarı</label>
        <input type="password" class="form-control" id="setKey" placeholder="AIza... veya AQ...">
        <div style="font-size:11px; color:var(--tx3); margin-top:4px;">
          Google AI Studio'dan ücretsiz anahtar alabilirsiniz.
        </div>
      </div>
      
      <div class="form-group" style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label>Hafıza (Mesaj)</label>
          <input type="number" class="form-control" id="setCtx" min="2" max="50" value="10">
        </div>
        <div style="flex:1;">
          <label>Yaratıcılık (0-1)</label>
          <input type="number" class="form-control" id="setTemp" min="0" max="1" step="0.1" value="0.7">
        </div>
      </div>
      
      <div class="form-group">
        <label>Bulut Yedekleme (Firebase URL)</label>
        <input type="text" class="form-control" id="setCloudUrl" placeholder="https://xxx.firebasedatabase.app">
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button type="button" class="btn btn-ghost" style="flex:1;" onclick="cloudSave(event)">☁️ Buluta Kaydet</button>
          <button type="button" class="btn btn-ghost" style="flex:1;" onclick="cloudLoad(event)">⬇️ Buluttan Yükle</button>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-primary" onclick="saveSettings(event)">Kaydet</button>
    </div>
  </div>
</div>

<!-- ASİSTAN (PERSONA) MODALI -->
<div class="modal-bg" id="modalPersona" onclick="bgClickClose(event, 'modalPersona')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div class="modal-title">Asistan Düzenle</div>
      <button type="button" class="btn-icon" onclick="closeModal(event, 'modalPersona')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="persId">
      <div class="form-group">
        <label>Adı</label>
        <input type="text" class="form-control" id="persName" placeholder="Örn: Yazılım Uzmanı">
      </div>
      <div class="form-group">
        <label>İkon (Emoji)</label>
        <input type="text" class="form-control" id="persIcon" placeholder="👨‍💻" maxlength="4">
      </div>
      <div class="form-group">
        <label>Görev / Sistem Promptu</label>
        <textarea class="form-control" id="persPrompt" rows="5"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-primary" onclick="savePersona(event)">Kaydet</button>
    </div>
  </div>
</div>

<!-- KOD ÇALIŞTIRICI (SANDBOX) MODALI -->
<div class="modal-bg" id="modalSandbox" onclick="bgClickClose(event, 'modalSandbox')" style="padding:0;">
  <div class="modal wide" onclick="event.stopPropagation()" style="height:90vh; max-width:95vw; border-radius:12px;">
    <div class="modal-head">
      <div class="modal-title">▶️ Kod Önizleme (Sandbox)</div>
      <button type="button" class="btn-icon" onclick="closeModal(event, 'modalSandbox')">✕</button>
    </div>
    <div class="modal-body" style="padding:0; overflow:hidden;">
      <iframe id="iframeSandbox" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
    </div>
  </div>
</div>

<!-- ŞABLON EKLEME MODALI -->
<div class="modal-bg" id="modalPrompt" onclick="bgClickClose(event, 'modalPrompt')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div class="modal-title">Yeni Şablon Ekle</div>
      <button type="button" class="btn-icon" onclick="closeModal(event, 'modalPrompt')">✕</button>
    </div>
    <div class="modal-body">
      <input type="text" class="form-control" id="prTitle" placeholder="Şablon Adı">
      <textarea class="form-control" id="prText" rows="4" style="margin-top:10px;" placeholder="Şablon Metni..."></textarea>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-primary" onclick="savePrompt(event)">Kaydet</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
/* =========================================
   1. SABİTLER VE DEĞİŞKENLER
   ========================================= */
const EMBEDDED_KEY = 'AQ.Ab8RN6KTOG0Zoo--lzgyBhiXPP7zq4NVb8m8Mg3J8hE-lmMlxw';
const K = { data: 'aiv5_data', theme: 'aiv5_theme' };

// PDF.js Ayarları
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// Varsayılan Asistanlar
const DEFAULT_PERSONAS = [
  { id: 'general', icon: '🤖', name: 'Genel Asistan', prompt: 'Sen yardımcı bir yapay zeka asistanısın. Türkçe, kısa ve net cevap ver. Kod sorulursa markdown kod bloğu kullan.' },
  { id: 'coder', icon: '👨‍💻', name: 'Uzman Yazılımcı', prompt: 'Sen kıdemli bir yazılım mühendisisin. Sorunları analiz et, temiz ve çalışır kod yaz. Sadece kod verme, kısa bir açıklama da ekle. Hata ayıklarken nedenini belirt.' }
];

// Varsayılan Prompt Şablonları
const DEFAULT_PROMPTS = [
  { id: 'p1', title: 'Kod Refactor', text: 'Aşağıdaki kodu daha performanslı ve okunabilir olacak şekilde refactor et:\n\n' },
  { id: 'p2', title: 'Hata Ayıkla', text: 'Aşağıdaki kodda bir hata var, lütfen nedenini bul ve düzeltilmiş halini ver:\n\n' },
  { id: 'p3', title: 'E-posta Yaz', text: 'Aşağıdaki konu hakkında profesyonel ve resmi bir e-posta yaz:\n\n' }
];

// Uygulama Durumu
let State = {
  settings: { 
    provider: 'gemini', 
    model: 'gemini-3.8-flash', // GÜNCELLENDİ
    key: EMBEDDED_KEY, 
    ctx: 10, 
    temp: 0.7, 
    cloudUrl: '' 
  },
  personas: [...DEFAULT_PERSONAS],
  prompts: [...DEFAULT_PROMPTS],
  chats: [],
  activeChatId: null,
  busy: false,
  abortCtrl: null,
  attachments: [],
  recognition: null,
  isRecording: false
};

// Token Fiyatlandırma (Maliyet hesabı için)
const PRICES = {
  'gemini-3.8-flash': { in: 0.10, out: 0.40 },
  'gemini-3.6-flash': { in: 0.075, out: 0.30 },
  'gemini-3.5-flash-lite': { in: 0.0375, out: 0.15 },
  'gpt-4o-mini': { in: 0.15, out: 0.60 },
  'gpt-4o': { in: 2.50, out: 10.00 }
};

/* =========================================
   2. BAŞLATMA VE KAYIT
   ========================================= */
function init() {
  try {
    const saved = localStorage.getItem(K.data);
    if (saved) {
      const parsed = JSON.parse(saved);
      State.settings = { ...State.settings, ...parsed.settings };
      State.personas = parsed.personas || [...DEFAULT_PERSONAS];
      State.prompts = parsed.prompts || [...DEFAULT_PROMPTS];
      State.chats = parsed.chats || [];
      State.activeChatId = parsed.activeChatId;
    }
    
    // Eski model adı kayıtlıysa yenisini ata
    if (State.settings.model === 'gemini-2.0-flash' || State.settings.model === 'gemini-2.0-flash-exp') {
      State.settings.model = 'gemini-3.8-flash';
    }

    if (!State.settings.key) State.settings.key = EMBEDDED_KEY;
    if (localStorage.getItem(K.theme) === 'light') document.documentElement.classList.add('light');
    
    if (window.innerWidth <= 768) document.getElementById('menuBtn').style.display = 'block';
    
    setupSpeechRecognition();
    setupDragAndDrop();

    if (!State.chats.length) newChat();
    else renderAll();
    
    // Ayarları inputlara doldur
    document.getElementById('setProv').value = State.settings.provider;
    updateModelList();
    document.getElementById('setKey').value = State.settings.key;
    document.getElementById('setCtx').value = State.settings.ctx;
    document.getElementById('setTemp').value = State.settings.temp;
    document.getElementById('setCloudUrl').value = State.settings.cloudUrl || '';
    
    if (State.activeChatId) {
      const c = State.chats.find(x => x.id === State.activeChatId);
      if (c && c.msgs.length === 0) showWelcome();
    }
    
    updateCostInfo();
  } catch (e) {
    console.error("Başlatma hatası:", e);
  }
}

function save() {
  try {
    localStorage.setItem(K.data, JSON.stringify({
      settings: State.settings,
      personas: State.personas,
      prompts: State.prompts,
      chats: State.chats,
      activeChatId: State.activeChatId
    }));
  } catch (e) {
    toast('Depolama alanı doldu! Lütfen eski sohbetleri silin.', 'error');
  }
}

/* =========================================
   3. SOHBET YÖNETİMİ
   ========================================= */
function newChat(e) {
  if (e) e.preventDefault();
  const c = { 
    id: Date.now().toString(), 
    title: 'Yeni Sohbet', 
    personaId: 'general', 
    msgs: [], 
    created: Date.now() 
  };
  State.chats.unshift(c);
  State.activeChatId = c.id;
  save();
  renderAll();
  showWelcome();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('promptInput').focus();
  updateCostInfo();
}

function deleteChat(id, e) {
  if (e) e.stopPropagation();
  if (!confirm('Bu sohbet silinsin mi?')) return;
  
  State.chats = State.chats.filter(x => x.id !== id);
  if (State.activeChatId === id) {
    State.activeChatId = State.chats[0]?.id || null;
    if (!State.activeChatId) newChat(null);
    else renderAll();
  } else {
    renderAll();
  }
  save();
}

function selectChat(id, e) {
  if (e) e.preventDefault();
  State.activeChatId = id;
  save();
  renderAll();
  document.getElementById('sidebar').classList.remove('open');
  updateCostInfo();
}

function getActiveChat() {
  return State.chats.find(x => x.id === State.activeChatId);
}

/* =========================================
   4. ARAYÜZ ÇİZİMİ (RENDER)
   ========================================= */
function renderAll() {
  renderChatList();
  renderPersonaList();
  renderPromptList();
  renderChatArea();
}

function renderChatList() {
  const html = State.chats.map(c => `
    <div class="item ${c.id === State.activeChatId ? 'active' : ''}" onclick="selectChat('${c.id}', event)">
      <div class="item-title">${escapeHTML(c.title)}</div>
      <button type="button" class="btn-icon" onclick="deleteChat('${c.id}', event)" style="width:24px; height:24px; font-size:12px;">✕</button>
    </div>
  `).join('');
  document.getElementById('chatList').innerHTML = html;
}

function renderPersonaList() {
  const html = State.personas.map(p => `
    <div class="item" onclick="openPersonaModal('${p.id}', event)">
      <div style="font-size:20px;">${p.icon}</div>
      <div style="flex:1;">
        <div class="item-title">${escapeHTML(p.name)}</div>
        <div class="item-sub">${p.id.startsWith('custom_') ? 'Özel' : 'Varsayılan'}</div>
      </div>
    </div>
  `).join('');
  document.getElementById('personaList').innerHTML = html;
}

function renderPromptList() {
  const html = `
    <button type="button" class="btn-new" onclick="openModal(event, 'modalPrompt')" style="background:var(--blue);">➕ Yeni Şablon</button>
    ${State.prompts.map(p => `
      <div class="item" onclick="usePrompt('${p.id}', event)">
        <div class="item-title">📝 ${escapeHTML(p.title)}</div>
      </div>
    `).join('')}
  `;
  document.getElementById('promptList').innerHTML = html;
}

function renderChatArea() {
  const c = getActiveChat();
  if (!c) return;
  
  const persona = State.personas.find(p => p.id === c.personaId) || State.personas[0];
  document.getElementById('currentChatTitle').innerText = c.title;
  document.getElementById('currentChatMeta').innerHTML = `${persona.icon} ${persona.name} · ${State.settings.model}`;
  
  const msgsBox = document.getElementById('messages');
  if (c.msgs.length === 0) {
    msgsBox.innerHTML = '';
    return;
  }

  msgsBox.innerHTML = c.msgs.map(m => {
    // Markdown veya Düz Metin
    let text = m.role === 'assistant' ? parseMarkdown(m.content) : escapeHTML(m.content).replace(/\n/g, '<br>');
    // Resim eki
    let imgHtml = m.img ? `<img src="${m.img}" style="max-width:100%; border-radius:8px; margin-top:8px;">` : '';
    // Asistan ise butonlar
    let actions = '';
    if (m.role === 'assistant') {
      actions = `
        <div class="msg-actions">
          <button type="button" onclick="speakText(this, event)" data-text="${escapeHTML(m.content)}">🔊 Dinle</button>
          <button type="button" onclick="branchChat('${m.id}', event)">🌿 Dallandır</button>
          <button type="button" onclick="copyText(this, event)" data-text="${escapeHTML(m.content)}">📋 Kopyala</button>
        </div>
      `;
    }
    return `
      <div class="msg ${m.role}">
        <div class="avatar">${m.role === 'user' ? '👤' : persona.icon}</div>
        <div class="bubble">${text}${imgHtml}${actions}</div>
      </div>
    `;
  }).join('');
  
  msgsBox.scrollTop = msgsBox.scrollHeight;
}

/* =========================================
   5. MESAJLAŞMA VE API ÇAĞRISI
   ========================================= */
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend(e);
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
  document.getElementById('sendBtn').disabled = !el.value.trim() && State.attachments.length === 0;
}

function handleSend(e) {
  if (e) e.preventDefault();
  
  // Eğer işlem varsa iptal et (Stop butonu)
  if (State.busy) {
    if (State.abortCtrl) State.abortCtrl.abort();
    return;
  }
  
  const input = document.getElementById('promptInput');
  const text = input.value.trim();
  if (!text && State.attachments.length === 0) return;
  
  const c = getActiveChat();
  const persona = State.personas.find(p => p.id === c.personaId) || State.personas[0];

  const userMsg = { id: Date.now().toString(), role: 'user', content: text, t: Date.now() };
  
  // Resim eki
  const imgAtt = State.attachments.find(a => a.isImg);
  if (imgAtt) userMsg.img = imgAtt.content;
  
  // PDF veya Metin dosyası ekleri
  const textAtts = State.attachments.filter(a => !a.isImg);
  if (textAtts.length) {
    userMsg.content += '\n\n--- EKLENEN DOSYALAR ---\n';
    textAtts.forEach(a => {
      userMsg.content += `\n[${a.name}]\n${a.content}\n`;
    });
  }

  c.msgs.push(userMsg);
  
  // İlk mesajsa başlığı güncelle
  if (c.msgs.length === 1) {
    c.title = text.slice(0, 30) || 'Dosya Analizi';
  }

  input.value = '';
  input.style.height = 'auto';
  State.attachments = [];
  renderAttachments();
  document.getElementById('sendBtn').disabled = true;
  
  renderChatArea();
  save();
  
  fetchAI(c, persona);
}

async function fetchAI(chat, persona) {
  State.busy = true;
  State.abortCtrl = new AbortController();
  
  const btn = document.getElementById('sendBtn');
  btn.className = 'btn-send stop';
  btn.innerHTML = '⏹';
  btn.disabled = false;

  const aiMsg = { id: Date.now().toString() + 'a', role: 'assistant', content: '', t: Date.now() };
  chat.msgs.push(aiMsg);
  renderChatArea();

  const msgsBox = document.getElementById('messages');
  const lastBubble = msgsBox.lastElementChild.querySelector('.bubble');
  lastBubble.innerHTML = '<span style="color:var(--tx3);">Düşünüyor...</span>';

  // Bağlam (Hafıza) Hazırlığı
  let contextMsgs = [];
  const ctxLimit = parseInt(State.settings.ctx) || 10;
  const history = chat.msgs.filter(m => m !== aiMsg);
  const startIdx = Math.max(0, history.length - ctxLimit);
  
  for (let i = startIdx; i < history.length; i++) {
    contextMsgs.push({ role: history[i].role, content: history[i].content, img: history[i].img });
  }

  try {
    const stream = callAPI(persona.prompt, contextMsgs, State.abortCtrl.signal);
    let fullText = '';
    
    for await (const chunk of stream) {
      fullText += chunk;
      lastBubble.innerHTML = parseMarkdown(fullText) + '<span style="display:inline-block;width:8px;height:14px;background:var(--gold);animation:pulse 1s infinite;vertical-align:middle;margin-left:4px;"></span>';
      msgsBox.scrollTop = msgsBox.scrollHeight;
    }
    aiMsg.content = fullText;
    
  } catch (err) {
    if (err.name === 'AbortError') {
      aiMsg.content = (aiMsg.content || '') + '\n\n*[Durduruldu]*';
    } else {
      aiMsg.content = `⚠️ **Hata:** ${err.message}`;
      toast(err.message, 'error');
    }
  } finally {
    State.busy = false;
    State.abortCtrl = null;
    btn.className = 'btn-send';
    btn.innerHTML = '➤';
    renderChatArea();
    save();
    updateCostInfo();
  }
}

async function* callAPI(sysPrompt, messages, signal) {
  const prov = State.settings.provider;
  const model = State.settings.model;
  const key = State.settings.key;
  const temp = parseFloat(State.settings.temp);

  if (prov === 'gemini') {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${key}`;
    const body = {
      systemInstruction: { parts: [{ text: sysPrompt }] },
      contents: messages.map(m => {
        const parts = [];
        if (m.content) parts.push({ text: m.content });
        if (m.img) {
           const mime = m.img.split(';')[0].split(':')[1];
           const data = m.img.split(',')[1];
           parts.push({ inlineData: { mimeType: mime, data: data } });
        }
        return { role: m.role === 'user' ? 'user' : 'model', parts };
      }),
      generationConfig: { temperature: temp, maxOutputTokens: 4096 }
    };
    
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal,
      body: JSON.stringify(body)
    });
    
    if (!res.ok) {
      const t = await res.text();
      let msg = 'HTTP ' + res.status;
      try { msg = JSON.parse(t).error.message; } catch(e){}
      throw new Error(msg);
    }
    
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      
      for (const line of lines) {
        if (line.startsWith('data:')) {
          const d = line.slice(5).trim();
          if (!d) continue;
          try {
            const j = JSON.parse(d);
            const txt = j.candidates?.[0]?.content?.parts?.[0]?.text;
            if (txt) yield txt;
          } catch(e){}
        }
      }
    }
  } else if (prov === 'openai') {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      signal,
      body: JSON.stringify({
        model: model,
        messages: [{ role: 'system', content: sysPrompt }, ...messages.map(m => ({ role: m.role, content: m.content }))],
        temperature: temp,
        stream: true
      })
    });
    
    if (!res.ok) throw new Error('HTTP ' + res.status);
    
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const d = line.slice(6).trim();
          if (d === '[DONE]') return;
          try {
            const j = JSON.parse(d);
            const txt = j.choices?.[0]?.delta?.content;
            if (txt) yield txt;
          } catch(e){}
        }
      }
    }
  }
}

/* =========================================
   6. YARDIMCILAR (MARKDOWN, MALİYET, VS)
   ========================================= */
function escapeHTML(str) {
  return (str || '').replace(/[&<>'"]/g, tag => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[tag]));
}

function parseMarkdown(text) {
  if (!text) return '';
  let h = text;
  const blocks = [];
  
  // 1. Kod blokları (Sandbox butonlu)
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const i = blocks.length;
    const canRun = /html|js|javascript/i.test(lang);
    const runBtn = canRun ? `<button type="button" onclick="runCode(this)">▶️ Çalıştır</button>` : '';
    blocks.push(`
      <div class="code-wrap">
        <div class="code-head"><span>${escapeHTML(lang || 'kod')}</span>${runBtn}</div>
        <pre><code>${escapeHTML(code)}</code></pre>
      </div>
    `);
    return `__BLOCK_${i}__`;
  });
  
  // 2. XSS Engelleme
  h = escapeHTML(h);
  
  // 3. Başlıklar & Kalınlıklar
  h = h.replace(/^### (.*)$/gm, '<h3 style="color:var(--gold); margin:10px 0 5px; font-size:16px;">$1</h3>');
  h = h.replace(/^## (.*)$/gm, '<h2 style="color:var(--gold); margin:12px 0 6px; font-size:18px;">$1</h2>');
  h = h.replace(/^# (.*)$/gm, '<h1 style="color:var(--gold); margin:14px 0 8px; font-size:20px;">$1</h1>');
  h = h.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.*?)\*/g, '<em>$1</em>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  
  // 4. Listeler
  h = h.replace(/^- (.*)$/gm, '<li>$1</li>').replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  h = h.replace(/^\d+\. (.*)$/gm, '<li>$1</li>').replace(/(<li>.*<\/li>)/s, '<ol>$1</ol>');
  
  // 5. Satır atlamaları
  h = h.replace(/\n/g, '<br>');
  
  // 6. Kod bloklarını geri koy
  blocks.forEach((b, i) => {
    h = h.replace(`__BLOCK_${i}__`, b);
  });
  
  return h;
}

function updateCostInfo() {
  const c = getActiveChat();
  if (!c) return;
  
  // Kaba bir token tahmini (karakter / 4)
  let totalChars = 0;
  c.msgs.forEach(m => totalChars += (m.content || '').length);
  
  const estTokens = Math.ceil(totalChars / 4);
  const price = PRICES[State.settings.model] || { in: 0, out: 0 };
  // Ortalama bir maliyet hesabı (50% input, 50% output varsayımı)
  const estCost = (estTokens / 2 / 1000000 * price.in) + (estTokens / 2 / 1000000 * price.out);
  
  document.getElementById('costInfo').innerHTML = `~${estTokens} token · ~$${estCost.toFixed(4)}`;
}

/* =========================================
   7. ÖZEL ARAÇLAR (SES, PDF, KOD, DALLANDIRMA)
   ========================================= */
function runCode(btn) {
  const pre = btn.closest('.code-wrap').querySelector('code');
  const code = pre.textContent;
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font-family:sans-serif;padding:20px;}</style></head><body>${code}</body></html>`;
  document.getElementById('iframeSandbox').srcdoc = html;
  openModal(null, 'modalSandbox');
}

function speakText(btn, e) {
  if (e) e.preventDefault();
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(btn.getAttribute('data-text'));
  u.lang = 'tr-TR';
  speechSynthesis.speak(u);
}

function copyText(btn, e) {
  if (e) e.preventDefault();
  navigator.clipboard.writeText(btn.getAttribute('data-text')).then(() => toast('Kopyalandı', ''));
}

function branchChat(msgId, e) {
  if (e) e.preventDefault();
  const c = getActiveChat();
  const idx = c.msgs.findIndex(m => m.id === msgId);
  if (idx < 0) return;
  
  const newC = {
    id: Date.now().toString(),
    title: c.title + ' (Dal)',
    personaId: c.personaId,
    msgs: JSON.parse(JSON.stringify(c.msgs.slice(0, idx + 1))),
    created: Date.now()
  };
  
  State.chats.unshift(newC);
  State.activeChatId = newC.id;
  save();
  renderAll();
  toast('🌿 Sohbet buradan dallandırıldı', '');
}

/* =========================================
   8. DOSYA İŞLEMLERİ (PDF, SES, SÜRÜKLE BIRAK)
   ========================================= */
function setupSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  
  State.recognition = new SR();
  State.recognition.lang = 'tr-TR';
  State.recognition.continuous = false;
  State.recognition.interimResults = true;
  
  State.recognition.onresult = (e) => {
    let txt = '';
    for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
    const inp = document.getElementById('promptInput');
    inp.value = txt;
    autoResize(inp);
  };
  
  State.recognition.onend = () => {
    State.isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
  };
}

function toggleMic(e) {
  if (e) e.preventDefault();
  if (!State.recognition) return toast('Sesli giriş desteklenmiyor.', 'error');
  
  if (State.isRecording) {
    State.recognition.stop();
  } else {
    State.recognition.start();
    State.isRecording = true;
    document.getElementById('micBtn').classList.add('recording');
  }
}

function setupDragAndDrop() {
  const overlay = document.getElementById('dropOverlay');
  let dragCounter = 0;
  
  window.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragCounter++;
    overlay.classList.add('active');
  });
  
  window.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter === 0) overlay.classList.remove('active');
  });
  
  window.addEventListener('dragover', (e) => {
    e.preventDefault();
  });
  
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCounter = 0;
    overlay.classList.remove('active');
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      handleFiles(e, e.dataTransfer.files);
    }
  });
}

async function handleFiles(e, files) {
  if (e) e.preventDefault();
  
  for (const f of files) {
    if (f.type.startsWith('image/')) {
      // Görsel
      const reader = new FileReader();
      reader.onload = ev => {
        State.attachments.push({ name: f.name, content: ev.target.result, isImg: true });
        renderAttachments();
      };
      reader.readAsDataURL(f);
    } 
    else if (f.type === 'application/pdf') {
      // PDF
      toast('PDF okunuyor, lütfen bekleyin...', '');
      const reader = new FileReader();
      reader.onload = async ev => {
        try {
          const typedarray = new Uint8Array(ev.target.result);
          const pdf = await pdfjsLib.getDocument(typedarray).promise;
          let fullText = '';
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            fullText += content.items.map(item => item.str).join(' ') + '\n';
          }
          State.attachments.push({ name: f.name, content: fullText, isImg: false });
          renderAttachments();
          toast('PDF başarıyla okundu.', '');
        } catch(err) {
          toast('PDF okunamadı: ' + err.message, 'error');
        }
      };
      reader.readAsArrayBuffer(f);
    } 
    else {
      // Metin / Kod
      const reader = new FileReader();
      reader.onload = ev => {
        State.attachments.push({ name: f.name, content: ev.target.result, isImg: false });
        renderAttachments();
      };
      reader.readAsText(f);
    }
  }
  document.getElementById('fileInput').value = '';
}

function renderAttachments() {
  const box = document.getElementById('attachList');
  box.innerHTML = State.attachments.map((a, i) => `
    <div class="att">
      ${a.isImg ? `<img src="${a.content}">` : '📄'}
      <span>${a.name}</span>
      <button type="button" class="del" onclick="State.attachments.splice(${i},1);renderAttachments();" style="background:none; border:none;">✕</button>
    </div>
  `).join('');
  document.getElementById('sendBtn').disabled = !document.getElementById('promptInput').value.trim() && State.attachments.length === 0;
}

/* =========================================
   9. MODAL VE ARAYÜZ ETKİLEŞİMLERİ
   ========================================= */
function toggleSidebar(e) {
  if (e) e.preventDefault();
  document.getElementById('sidebar').classList.toggle('open');
}

function switchTab(e, tab) {
  if (e) e.preventDefault();
  document.querySelectorAll('.side-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.side-content').forEach(c => c.classList.add('hidden'));
  
  document.querySelectorAll('.side-tab').forEach(t => {
    if (t.innerText.toLowerCase().includes(tab.substring(0, 3))) t.classList.add('active');
  });
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
}

function openModal(e, id) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  document.getElementById(id).classList.add('active');
  document.body.classList.add('modal-open');
}

function closeModal(e, id) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  document.getElementById(id).classList.remove('active');
  document.body.classList.remove('modal-open');
}

function bgClickClose(e, id) {
  if (e.target.id === id) closeModal(e, id);
}

function toggleTheme(e) {
  if (e) e.preventDefault();
  document.documentElement.classList.toggle('light');
  localStorage.setItem(K.theme, document.documentElement.classList.contains('light') ? 'light' : 'dark');
}

function clearChat(e) {
  if (e) e.preventDefault();
  const c = getActiveChat();
  if (!c || !c.msgs.length) return;
  if (confirm('Bu sohbet silinsin mi?')) {
    c.msgs = [];
    c.title = 'Yeni Sohbet';
    renderAll();
    save();
    showWelcome();
    updateCostInfo();
  }
}

function showWelcome() {
  const c = getActiveChat();
  if (!c || c.msgs.length > 0) return;
  const p = State.personas.find(x => x.id === c.personaId) || State.personas[0];
  
  document.getElementById('messages').innerHTML = `
    <div style="text-align:center; padding:40px 20px; color:var(--tx2);">
      <div style="font-size:48px; margin-bottom:16px;">${p.icon}</div>
      <h2 style="color:var(--tx0); margin-bottom:8px;">${p.name}</h2>
      <p style="font-size:14px; max-width:400px; margin:0 auto; line-height:1.5;">${p.prompt}</p>
    </div>
  `;
}

/* =========================================
   10. AYARLAR VE KİŞİSELLEŞTİRME
   ========================================= */
function updateModelList(e) {
  if (e) e.preventDefault();
  const prov = document.getElementById('setProv').value;
  const sel = document.getElementById('setModel');
  const models = {
    gemini: ['gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite'],
    openai: ['gpt-4o-mini', 'gpt-4o']
  };
  sel.innerHTML = models[prov].map(m => `<option value="${m}" ${State.settings.model===m?'selected':''}>${m}</option>`).join('');
}

function saveSettings(e) {
  if (e) e.preventDefault();
  State.settings.provider = document.getElementById('setProv').value;
  State.settings.model = document.getElementById('setModel').value;
  State.settings.key = document.getElementById('setKey').value.trim();
  State.settings.ctx = parseInt(document.getElementById('setCtx').value);
  State.settings.temp = parseFloat(document.getElementById('setTemp').value);
  State.settings.cloudUrl = document.getElementById('setCloudUrl').value.trim();
  
  save();
  closeModal(null, 'modalSettings');
  renderChatArea();
  updateCostInfo();
  toast('Ayarlar kaydedildi.', '');
}

function newPersona(e) {
  if (e) e.preventDefault();
  document.getElementById('persId').value = 'custom_' + Date.now();
  document.getElementById('persName').value = '';
  document.getElementById('persIcon').value = '🧠';
  document.getElementById('persPrompt').value = '';
  openModal(null, 'modalPersona');
}

function openPersonaModal(id, e) {
  if (e) e.preventDefault();
  const p = State.personas.find(x => x.id === id);
  if (!p) return;
  document.getElementById('persId').value = p.id;
  document.getElementById('persName').value = p.name;
  document.getElementById('persIcon').value = p.icon;
  document.getElementById('persPrompt').value = p.prompt;
  openModal(null, 'modalPersona');
}

function savePersona(e) {
  if (e) e.preventDefault();
  const id = document.getElementById('persId').value;
  const name = document.getElementById('persName').value.trim();
  const icon = document.getElementById('persIcon').value.trim() || '🤖';
  const prompt = document.getElementById('persPrompt').value.trim();
  
  if (!name || !prompt) return toast('İsim ve Prompt zorunludur', 'error');
  
  const idx = State.personas.findIndex(x => x.id === id);
  if (idx > -1) State.personas[idx] = { id, name, icon, prompt };
  else State.personas.push({ id, name, icon, prompt });
  
  save();
  renderPersonaList();
  closeModal(null, 'modalPersona');
  toast('Asistan kaydedildi.', '');
}

function usePrompt(id, e) {
  if (e) e.preventDefault();
  const p = State.prompts.find(x => x.id === id);
  if (!p) return;
  const inp = document.getElementById('promptInput');
  inp.value = p.text + inp.value;
  inp.focus();
  autoResize(inp);
  document.getElementById('sidebar').classList.remove('open');
}

function savePrompt(e) {
  if (e) e.preventDefault();
  const title = document.getElementById('prTitle').value.trim();
  const text = document.getElementById('prText').value.trim();
  if (!title || !text) return;
  State.prompts.push({ id: Date.now().toString(), title, text });
  save();
  renderPromptList();
  closeModal(null, 'modalPrompt');
  document.getElementById('prTitle').value = '';
  document.getElementById('prText').value = '';
}

function exportChat(e) {
  if (e) e.preventDefault();
  const c = getActiveChat();
  if (!c || !c.msgs.length) return;
  const md = c.msgs.map(m => `**${m.role === 'user' ? 'Sen' : 'Asistan'}:**\n\n${m.content}\n`).join('\n---\n\n');
  const blob = new Blob([md], {type: 'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = c.title + '.md';
  a.click();
}

/* Bulut Yedekleme */
async function cloudSave(e) {
  if (e) e.preventDefault();
  const url = document.getElementById('setCloudUrl').value.trim();
  if (!url) return toast('Firebase URL girin.', 'error');
  try {
    await fetch(url + '/aiv5_backup.json', { method: 'PUT', body: localStorage.getItem(K.data) });
    toast('☁️ Buluta kaydedildi.', '');
  } catch(err) {
    toast('Bulut hatası: ' + err.message, 'error');
  }
}

async function cloudLoad(e) {
  if (e) e.preventDefault();
  const url = document.getElementById('setCloudUrl').value.trim();
  if (!url) return toast('Firebase URL girin.', 'error');
  if (!confirm('Buluttaki veri yüklenecek, mevcut veriler silinecek. Onaylıyor musunuz?')) return;
  try {
    const res = await fetch(url + '/aiv5_backup.json');
    const data = await res.json();
    if (data) {
      localStorage.setItem(K.data, JSON.stringify(data));
      location.reload();
    } else {
      toast('Bulutta veri bulunamadı.', 'error');
    }
  } catch(err) {
    toast('Bulut hatası: ' + err.message, 'error');
  }
}

   11. KISAYOLLAR VE BAŞLATICI

  if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); newChat(null); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('convSearch')?.focus(); }
});
